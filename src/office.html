<title>Head Office</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;0,900;1,400&display=swap">

<style>
:root{
  --ground:#F1F1F1; --surface:#FFFFFF; --surface-2:#F7F7F4; --surface-3:#EDEDE8;
  --ink:#111111; --ink-2:#5A5A56; --ink-3:#8C8C87;
  --rule:#DCDCD6; --rule-2:#EAEAE4;
  --signal:#FFCB05; --signal-ink:#0C0C0C; --signal-txt:#7A5E00;
  --stamp:#5A5A56; --stamp-wash:#F0EDE3;
  --ok:#2E7D4F; --ok-wash:#E6F2EA;
  --warn:#B2740B; --warn-wash:#FAF0DA;
  --crit:#C0392B; --crit-wash:#FBE7E4;
  --shadow:0 1px 2px rgba(16,19,23,.05), 0 8px 24px rgba(16,19,23,.07);
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Roboto Mono",Menlo,monospace;
  --sans:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0C0C0C; --surface:#151515; --surface-2:#1D1D1C; --surface-3:#262624;
    --ink:#F2F2EF; --ink-2:#A0A09B; --ink-3:#74746F;
    --rule:#2C2C2A; --rule-2:#212120;
    --signal:#FFCB05; --signal-ink:#0C0C0C; --signal-txt:#FFCB05;
    --stamp:#A0A09B; --stamp-wash:#241E08;
    --ok:#46B87A; --ok-wash:#14261B;
    --warn:#E0A93C; --warn-wash:#2A2214;
    --crit:#E4695C; --crit-wash:#2C1A18;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#0C0C0C; --surface:#151515; --surface-2:#1D1D1C; --surface-3:#262624;
  --ink:#F2F2EF; --ink-2:#A0A09B; --ink-3:#74746F;
  --rule:#2C2C2A; --rule-2:#212120;
  --signal:#FFCB05; --signal-ink:#0C0C0C; --signal-txt:#FFCB05;
  --stamp:#A0A09B; --stamp-wash:#241E08;
  --ok:#46B87A; --ok-wash:#14261B;
  --warn:#E0A93C; --warn-wash:#2A2214;
  --crit:#E4695C; --crit-wash:#2C1A18;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
:focus-visible{outline:2px solid var(--signal-txt); outline-offset:2px}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}

.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.lab{font-family:var(--mono); font-size:9.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-3)}

/* -- shell ------------------------------------------------------- */
.shell{display:grid; grid-template-columns:224px 1fr; min-height:100vh; min-height:100dvh}

.side{
  border-right:1px solid var(--rule); background:var(--surface);
  display:flex; flex-direction:column; position:sticky; top:0; height:100dvh;
}
.brand{padding:20px 20px 16px; border-bottom:1px solid var(--rule)}
.brand .w{display:flex; align-items:baseline; gap:8px; font-size:19px; font-weight:700; letter-spacing:.02em}
.brand .w b{font-weight:700; color:var(--signal-txt)}
.brand .w i{width:7px; height:7px; border:2px solid var(--signal); border-radius:50%; flex:none; transform:translateY(-1px)}
.brand .co{margin-top:12px; display:flex; align-items:center; gap:8px}
.brand .co svg{width:24px; height:24px; flex:none; border-radius:2px}
.brand .co span{font-size:11.5px; font-weight:700; line-height:1.2}

.nav{padding:10px 10px; display:flex; flex-direction:column; gap:1px; flex:1; overflow-y:auto}
.nav button{
  display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:7px;
  color:var(--ink-2); text-align:left; width:100%;
}
.nav button svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.7; flex:none}
.nav button:hover{background:var(--surface-2); color:var(--ink)}
.nav button.on{background:var(--surface-2); color:var(--ink); font-weight:600}
.nav button.on svg{stroke:var(--signal-txt)}
.nav button .ct{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--ink-3)}
.nav .sec{padding:14px 11px 6px}

.side .foot{padding:12px 14px; border-top:1px solid var(--rule); display:flex; gap:10px; align-items:center}
.side .foot button{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.side .foot button:hover{color:var(--ink)}

.main{min-width:0; display:flex; flex-direction:column}
.top{
  padding:18px 28px; border-bottom:1px solid var(--rule); background:var(--surface);
  display:flex; align-items:flex-end; gap:18px; flex-wrap:wrap; position:sticky; top:0; z-index:10;
}
.top h1{margin:0; font-size:24px; font-weight:700; letter-spacing:-.01em; line-height:1.15}
.top .sub{margin:3px 0 0; font-size:13px; color:var(--ink-2)}
.top .sp{flex:1}
.top .stamp{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); border:1px solid var(--rule); padding:5px 9px; border-radius:5px;
}
.body{padding:24px 28px 60px; flex:1}

/* -- primitives -------------------------------------------------- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:1px;
      background:var(--rule); border:1px solid var(--rule); border-radius:4px; overflow:hidden}
.kpis > div{background:var(--surface); padding:15px 17px}
.kpis b{display:block; font-family:var(--mono); font-size:25px; font-weight:700;
        letter-spacing:-.03em; line-height:1.1; margin-top:5px}
.kpis .d{display:block; font-size:12px; color:var(--ink-2); margin-top:4px}
.kpis .up b{color:var(--ok)} .kpis .dn b{color:var(--crit)}

.sec{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:30px 0 10px}
.card{background:var(--surface); border:1px solid var(--rule); border-radius:4px; box-shadow:var(--shadow); overflow:hidden}

.tw{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:13.5px; min-width:680px}
th,td{padding:10px 15px; text-align:left; border-bottom:1px solid var(--rule-2); vertical-align:middle}
th{font-family:var(--mono); font-size:9.5px; letter-spacing:.15em; text-transform:uppercase;
   color:var(--ink-3); font-weight:600; background:var(--surface-2);
   border-bottom:1px solid var(--rule); white-space:nowrap; position:sticky; top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
td.n, th.n{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
td.name{font-weight:600}
td .sub{display:block; font-size:11.5px; color:var(--ink-3); font-weight:400; margin-top:1px}

.pill{display:inline-flex; align-items:center; gap:5px; padding:2.5px 8px; border-radius:20px;
      font-family:var(--mono); font-size:10.5px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap}
.pill.ok{background:var(--ok-wash); color:var(--ok)}
.pill.warn{background:var(--warn-wash); color:var(--warn)}
.pill.crit{background:var(--crit-wash); color:var(--crit)}
.pill.flat{background:var(--surface-2); color:var(--ink-2)}
.pill.sig{background:var(--signal); color:var(--signal-ink)}
.ed{font-family:var(--mono); font-size:9.5px; padding:2px 6px; border-radius:3px;
    background:var(--surface-2); color:var(--ink-2); border:1px solid var(--rule); white-space:nowrap}

/* programme bar: baseline against forecast */
.prog{position:relative; height:16px; min-width:130px; background:var(--surface-2); border-radius:3px; overflow:hidden}
.prog .base{position:absolute; left:0; top:0; bottom:8px; background:var(--ink-3); opacity:.4; border-radius:3px 0 0 0}
.prog .act{position:absolute; left:0; top:8px; bottom:0; border-radius:0 0 0 3px}
.prog .act.ok{background:var(--ok)} .prog .act.late{background:var(--crit)}
.prog .now{position:absolute; top:0; bottom:0; width:1.5px; background:var(--signal)}

/* control point meter */
.cp{display:flex; align-items:center; gap:9px}
.cp .track{flex:1; min-width:70px; height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden}
.cp .fill{height:100%; background:var(--signal)}
.cp span{font-family:var(--mono); font-size:11px; color:var(--ink-2); white-space:nowrap}

/* site cards */
.sites{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:14px}
.site{background:var(--surface); border:1px solid var(--rule); border-radius:4px;
      box-shadow:var(--shadow); padding:15px 16px; text-align:left; width:100%;
      transition:transform .14s ease, border-color .14s ease}
.site:hover{transform:translateY(-2px); border-color:var(--ink-3)}
.site .r1{display:flex; align-items:flex-start; gap:8px; margin-bottom:3px}
.site .r1 b{font-size:15px; font-weight:600; flex:1; min-width:0; line-height:1.25}
.site .town{font-size:11.5px; color:var(--ink-3)}
.site .rows{margin-top:12px; display:flex; flex-direction:column; gap:7px}
.site .row{display:flex; justify-content:space-between; gap:10px; font-size:12.5px}
.site .row span:first-child{color:var(--ink-2)}
.site .row span:last-child{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600}
.site .clk{margin-top:12px; padding-top:11px; border-top:1px solid var(--rule-2);
           display:flex; align-items:center; gap:8px; font-size:12px}
.site .clk .what{color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* filters */
.filters{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px}
.filters button{
  padding:5px 11px; border:1px solid var(--rule); border-radius:20px; background:var(--surface);
  font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2);
}
.filters button:hover{border-color:var(--ink-3); color:var(--ink)}
.filters button.on{background:var(--ink); color:var(--ground); border-color:var(--ink)}

/* detail */
.back{display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:10.5px;
      letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2); margin-bottom:4px}
.back:hover{color:var(--ink)}
.back svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2.2}
.two{display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:16px}
.panel{background:var(--surface); border:1px solid var(--rule); border-radius:4px; box-shadow:var(--shadow)}
.panel h3{margin:0; padding:12px 16px; font-size:12px; font-weight:600; border-bottom:1px solid var(--rule);
          font-family:var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.panel .in{padding:14px 16px}
.kv{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--rule-2); font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink-2)}
.kv span:last-child{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600}
.kv .up{color:var(--ok)} .kv .dn{color:var(--crit)}


/* Their own device: a flat yellow panel with a hard black rule around it.
   Used wherever the accent has to carry weight rather than whisper. */
.chip.sig, .pill.sig, .opt.sig, .mini.go, .nav button.on,
.card.accent .n, .fields .num, .ask .n, .cin button, .filters button.on{
  border:1px solid #0C0C0C;
}
.eyebrow::before{height:4px; width:26px}

.empty{padding:40px 20px; text-align:center; color:var(--ink-2)}

/* toolbar: search, language, copy */
.tools{display:flex; align-items:center; gap:8px}
.tools input{
  width:190px; padding:6px 11px; border:1px solid var(--rule); border-radius:7px;
  background:var(--surface-2); color:var(--ink); font:inherit; font-size:13px;
}
.tools input:focus{outline:none; border-color:var(--signal); background:var(--surface)}
.tools button{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-2); border:1px solid var(--rule); border-radius:6px; padding:6px 10px;
}
.tools button:hover{border-color:var(--ink); color:var(--ink)}
.tools .langbtn{min-width:42px; text-align:center}
.tools .langbtn.af{border-color:var(--signal); color:var(--signal-txt)}

th.sortable{cursor:pointer; user-select:none}
th.sortable:hover{color:var(--ink)}
th.sorted{color:var(--signal-txt)}
th.sorted::after{content:" 91"; font-size:11px}
th.sorted[data-dir="desc"]::after{content:" 93"}

#toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:200;
  background:var(--ink); color:var(--ground); padding:10px 16px; border-radius:4px;
  font-size:13.5px; box-shadow:0 8px 30px rgba(0,0,0,.35);
}
#toast[hidden]{display:none}
.kbd{font-family:var(--mono); font-size:10px; color:var(--ink-3); padding:0 4px;
     border:1px solid var(--rule); border-radius:3px}

/* action queue */
.job{display:flex; gap:14px; align-items:flex-start; padding:13px 16px;
     border-bottom:1px solid var(--rule-2); border-left:3px solid transparent}
.job:last-child{border-bottom:0}
.job.crit{border-left-color:var(--crit)} .job.warn{border-left-color:var(--warn)} .job.ok{border-left-color:var(--ok)}
.job .jb{flex:1; min-width:0}
.job .jt{font-size:14.5px; font-weight:600; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.job .jw{font-size:12.5px; color:var(--ink-2); margin-top:4px}
.job .ja{font-size:12.5px; color:var(--signal-txt); margin-top:5px; font-weight:600}
.job .jx{display:flex; gap:7px; flex:none}
.mini{font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
      border:1px solid var(--rule); border-radius:5px; padding:5px 9px; color:var(--ink-2)}
.mini:hover{border-color:var(--ink); color:var(--ink)}
.mini.go{background:var(--signal); color:var(--signal-ink); border-color:var(--signal)}
.mini.pin{margin-top:7px}

/* assistant */
.chat .log{max-height:290px; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:11px}
.cm{display:flex; flex-direction:column; align-items:flex-start}
.cm.me{align-items:flex-end}
.cm .bub{max-width:76%; padding:9px 13px; border-radius:3px 12px 12px 12px; font-size:14px;
         background:var(--surface-2); border:1px solid var(--rule); line-height:1.5}
.cm.me .bub{background:var(--ink); color:var(--ground); border-color:var(--ink); border-radius:4px 3px 12px 12px}
.sugg{display:flex; gap:7px; flex-wrap:wrap; padding:0 16px 12px}
.chip{padding:5px 11px; border:1px solid var(--rule); border-radius:20px; font-size:12px; color:var(--ink-2)}
.chip:hover{border-color:var(--signal); color:var(--signal-txt)}
.cin{display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--rule)}
.cin input{flex:1; padding:9px 12px; border:1px solid var(--rule); border-radius:4px;
           background:var(--surface-2); color:var(--ink); font:inherit; font-size:14px}
.cin input:focus{outline:none; border-color:var(--signal); background:var(--surface)}

/* widgets */
.wgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:14px}
.widget .wh{display:flex; align-items:center; justify-content:space-between; gap:10px;
            padding:11px 15px; border-bottom:1px solid var(--rule); font-size:12px; font-weight:600;
            font-family:var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.widget .wb{padding:13px 15px; display:flex; flex-direction:column; gap:9px}
.brow{display:flex; align-items:center; gap:10px; font-size:12.5px}
.brow .bl{width:80px; flex:none; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.brow .bt{flex:1; height:9px; background:var(--surface-2); border-radius:5px; overflow:hidden; display:flex}
.brow .bt i{height:100%; border-radius:5px}
.brow .bt i.pos{background:var(--signal)} .brow .bt i.neg{background:var(--crit)}
.brow .bv{width:58px; text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600}
.lrow{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px}
.lrow .ll{min-width:0; overflow:hidden}
.lrow .ll em{display:block; font-style:normal; font-size:11px; color:var(--ink-3)}

/* knowledge graph */
.brainwrap{position:relative; display:grid; grid-template-columns:1fr 288px;
           border:1px solid var(--rule); border-radius:4px; overflow:hidden;
           background:var(--surface); box-shadow:var(--shadow)}
#brain{width:100%; height:600px; display:block; cursor:grab;
  background:radial-gradient(circle at 50% 45%, rgba(255,194,14,.09), transparent 62%)}
#gtip{position:absolute; z-index:5; pointer-events:none; background:var(--ink); color:var(--ground);
      padding:7px 10px; border-radius:7px; font-size:12px; max-width:230px; box-shadow:0 6px 22px rgba(0,0,0,.3)}
#gtip b{display:block; font-weight:600}
#gtip span{font-family:var(--mono); font-size:10px; opacity:.7}
#gtip[hidden]{display:none}
#gpanel{border-left:1px solid var(--rule); padding:16px; overflow-y:auto; max-height:600px; background:var(--surface-2)}
.gcounts{display:flex; flex-wrap:wrap; gap:5px 10px; margin-top:14px}
.gcounts span{display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10.5px; color:var(--ink-2)}
.gcounts i{width:7px; height:7px; border-radius:50%; flex:none}
.gl .gr.risk{color:var(--crit)}
#gstat{font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3)}
#gpanel h4{margin:6px 0 12px; font-size:15px; font-weight:600; line-height:1.3}
#gpanel p{font-size:13px; color:var(--ink-2); margin:8px 0 0}
.glinks{display:flex; flex-direction:column; gap:8px}
.gl{display:flex; flex-direction:column; gap:3px}
.gl .gr{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.gl .gn{font-size:12.5px; border-left:2px solid var(--rule); padding-left:8px}
.glegend{display:flex; gap:7px; flex-wrap:wrap; margin:12px 0 0}
.glegend button{display:inline-flex; align-items:center; gap:6px; padding:4px 10px;
                border:1px solid var(--rule); border-radius:20px; font-size:11.5px; color:var(--ink-2)}
.glegend button i{width:9px; height:9px; border-radius:50%; flex:none}
.glegend button.off{opacity:.38}
.glegend button:hover{border-color:var(--ink)}
.bq{display:flex; gap:8px; margin:14px 0 0}
.bq input{flex:1; padding:9px 12px; border:1px solid var(--rule); border-radius:4px;
          background:var(--surface); color:var(--ink); font:inherit; font-size:14px}
.bq input:focus{outline:none; border-color:var(--signal)}
.bans{margin-top:11px; font-size:13.5px; color:var(--ink-2); border-left:3px solid var(--signal);
      padding:9px 13px; background:var(--surface); border-radius:0 8px 8px 0}
.bans[hidden]{display:none}
@media (max-width:900px){
  .brainwrap{grid-template-columns:1fr}
  #gpanel{border-left:0; border-top:1px solid var(--rule); max-height:none}
  #brain{height:460px}
}
.foot-note{margin-top:18px; font-size:12px; color:var(--ink-3); line-height:1.55; max-width:80ch}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static; height:auto; border-right:0; border-bottom:1px solid var(--rule)}
  .brand{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px}
  .brand .co{margin-top:0}
  .nav{flex-direction:row; overflow-x:auto; padding:8px 10px}
  .nav button{white-space:nowrap}
  .nav button .ct, .nav .sec{display:none}
  .side .foot{display:none}
  .top{padding:14px 16px; position:static}
  .body{padding:18px 16px 50px}
}
</style>

<div class="shell">

  <aside class="side">
    <div class="brand">
      <div class="w"><span>Site<b>OS</b></span><i></i></div>
      <div class="co">
        <svg viewBox="0 0 100 100" role="img" aria-label="J.C. van der Linde and Venter Projects">
          <rect width="100" height="100" fill="#0B0B0B"/>
          <g transform="translate(6,21)"><polygon points="0,0 21,58 42,0 29,0 21,36 13,0" fill="#FFCB05"/></g>
          <g transform="translate(52,21)"><polygon points="0,0 21,58 42,0 29,0 21,36 13,0" fill="#FFCB05"/></g>
        </svg>
        <span>J.C. van der Linde<br>&amp; Venter Projects</span>
      </div>

  const overdue = S.outputs.filter(o => o.status === "Overdue").reduce((a,o)=>a+o.amount,0);
  return { v, wBase, wNow, drift:wNow-wBase, risk, certified, retention, overdue };

function progBar(p){
  const s = D(p.start), b = D(p.pcBase), n = D(p.pcNow);
  const span = Math.max(n - s, b - s);
  const w = x => Math.max(2, Math.min(100, ((x - s) / span) * 100));
  const late = n > b;
  return `<div class="prog" title="${esc(fmt(b))} baseline, ${esc(fmt(n))} forecast">
    <div class="base" style="width:${w(b)}%"></div>
    <div class="act ${late?"late":"ok"}" style="width:${w(n)}%"></div>
    <div class="now" style="left:${w(TODAY)}%"></div>
  </div>`;
}
function cpMeter(p){
  const v = Math.round(p.cp.done / p.cp.total * 100);
  return `<div class="cp"><div class="track"><div class="fill" style="width:${v}%"></div></div>
    <span>${p.cp.done}/${p.cp.total}</span></div>`;
}
function meter(v, sev){
  return `<div class="cp"><div class="track"><div class="fill" style="width:${Math.min(100,v)}%;background:var(--${sev})"></div></div></div>`;
}
function head(title, sub, eyebrow){
  $("#head").innerHTML =
    (eyebrow?`<div class="lab" style="margin-bottom:6px">${esc(eyebrow)}</div>`:"") +
    `<h1>${esc(title)}</h1>${sub?`<p class="sub">${sub}</p>`:""}`;
}
function tbl(headers, rows, min){
  return `<div class="card"><div class="tw"><table${min?` style="min-width:${min}px"`:""}>
    <thead><tr>${headers.map(h=>`<th${h[1]?' class="'+h[1]+'"':""}>${h[0]}</th>`).join("")}</tr></thead>
    <tbody>${rows}</tbody></table></div></div>`;
}

    <div class="two" style="margin-top:22px">
      <div class="panel"><h3>Soonest clocks</h3><div class="tw"><table style="min-width:0"><tbody>
        ${soon.map(c=>{const wd=wdTo(c.due);return `<tr class="click" data-p="${c.proj}">
          <td><span class="pill ${sevOf(wd)}">${wd} wd</span></td>
          <td>${esc(c.what)}<span class="sub">${esc(proj(c.proj).name)} &middot; ${esc(c.basis)}</span></td>
          <td class="n">${c.at?R(c.at):"&ndash;"}</td></tr>`;}).join("")}
      </tbody></table></div></div>
      <div class="panel"><h3>Value areas</h3><div class="in">
        ${AREAS.map(a=>`<div class="kv"><span><b style="font-weight:600">${a[0]} ${esc(a[1])}</b><br><span class="lab">${esc(a[3])}</span></span>

    <button class="back" id="back">${ARROW} Back to portfolio</button>
    <div class="kpis" style="margin-top:10px">

      <div class="${slip>0?"dn":"up"}"><span class="lab">Programme</span><b>${slip>0?"+"+slip:slip} wd</b><span class="d">PC ${esc(fmt(D(p.pcNow)))}</span></div>
      <div><span class="lab">Cost to complete</span><b>${Rm(p.ctc)}</b><span class="d">${p.cp.total-p.cp.done} control points open</span></div>

      </div></div>
      <div class="panel"><h3>Against the locked baseline</h3><div class="in">
        <div class="kv"><span>Contract value</span><span>${R(p.value)} <span class="${p.value>=p.baseValue?"up":"dn"}">${p.value>=p.baseValue?"+":""}${R(p.value-p.baseValue)}</span></span></div>
        <div class="kv"><span>Margin</span><span>${p.nowMargin.toFixed(1)}% <span class="${dm>=0?"up":"dn"}">${dm>=0?"+":""}${dm.toFixed(1)}</span></span></div>
        <div class="kv"><span>Practical completion</span><span>${esc(fmt(D(p.pcNow)))} <span class="${slip>0?"dn":"up"}">${slip>0?"+"+slip+" wd":"on time"}</span></span></div>

/* ---------------- 01 Tender ---------------- */
function vTender(){
  const pipe = S.pipeline.reduce((a,t)=>a+t.value,0);
  const avgDays = Math.round(S.pipeline.reduce((a,t)=>a+t.days,0)/S.pipeline.length);
  const worst = S.estimating.slice().sort((a,b)=>(b.actual/b.tendered)-(a.actual/a.tendered))[0];
  head("Tender", "Bid speed, scope risk, estimating consistency, benchmark reuse", "01 Value area");
  return `
    <div class="kpis">
      <div><span class="lab">Out to tender</span><b>${Rm(pipe)}</b><span class="d">${S.pipeline.length} live bids</span></div>
      <div><span class="lab">Bid speed</span><b>${avgDays} d</b><span class="d">Average days spent per bid</span></div>
      <div class="dn"><span class="lab">Unpriced items</span><b>${S.pipeline.reduce((a,t)=>a+t.unpriced,0)}</b><span class="d">Provisional or missing across live bids</span></div>
      <div class="dn"><span class="lab">Worst drift</span><b>${worst.trade}</b><span class="d">${(((worst.actual/worst.tendered)-1)*100).toFixed(1)}% over tendered</span></div>
    </div>

    <div class="sec"><span class="lab">Live bids</span><span class="lab">Scope risk</span></div>
    ${tbl([["Tender"],["Value","n"],["Closes","n"],["Days on it","n"],["Qualifications","n"],["Unpriced","n"],["State"]],
      S.pipeline.map(t=>{const wd=wdTo(t.closes);
        return `<tr>
          <td class="name">${esc(t.name)}</td>
          <td class="n">${Rm(t.value)}</td>
          <td class="n"><span class="pill ${sevOf(wd)}">${wd} wd</span></td>
          <td class="n">${t.days}</td>
          <td class="n">${t.quals?t.quals:`<span style="color:var(--crit)">0</span>`}</td>
          <td class="n"><span style="color:var(--${t.unpriced>2?"crit":t.unpriced?"warn":"ok"})">${t.unpriced}</span></td>
          <td><span class="pill flat">${esc(t.state)}</span></td></tr>`;}).join(""), 620)}
    <p class="foot-note">A bid with zero qualifications is not a clean bid, it is unqualified risk carried for the length of the contract. Samrand has been priced for two days and has five provisional items still open.</p>

    <div class="sec"><span class="lab">Estimating consistency</span><span class="lab">Tendered against actual, closed work</span></div>
    ${tbl([["Trade"],["Tendered","n"],["Actual","n"],["Variance","n"],[""]],
      S.estimating.map(e=>{const d=(e.actual/e.tendered-1)*100;
        return `<tr><td class="name">${esc(e.trade)}</td>
          <td class="n">${R(e.tendered)}</td><td class="n">${R(e.actual)}</td>
          <td class="n" style="color:var(--${d>2?"crit":d<-2?"ok":"ink-2"})">${d>0?"+":""}${d.toFixed(1)}%</td>
          <td style="width:150px">${meter(Math.abs(d)*8, d>2?"crit":d<-2?"ok":"ink-3")}</td></tr>`;}).join(""), 560)}

    <div class="sec"><span class="lab">Benchmarks available to reuse</span></div>
    ${tbl([["Building type"],["Rate","n"],["From","n"],["Spread","n"]],
      S.benchmarks.map(b=>`<tr><td class="name">${esc(b.type)}</td>
        <td class="n">${R(b.rate)} / m2</td><td class="n">${b.source} project${b.source>1?"s":""}</td>
        <td class="n">${esc(b.spread)}</td></tr>`).join(""), 460)}
    <p class="foot-note">Benchmarks only exist because closed projects were signed off with their outcome recorded. A single-source rate with no spread is a guess wearing a number.</p>`;
}

/* ---------------- 02 Procurement ---------------- */
function vProcurement(){
  const saved = S.adjudications.reduce((a,x)=>a+(x.high-x.chosen),0);
  const worst = S.suppliers.slice().sort((a,b)=>a.onTime-b.onTime)[0];
  const late = S.expedite.filter(e=>!e.ordered);
  head("Procurement", "Quote comparison, supplier performance, lead-time risk, expediting", "02 Value area");
  return `
    <div class="kpis">
      <div class="up"><span class="lab">Against highest quote</span><b>${R(saved)}</b><span class="d">On ${S.adjudications.length} open adjudications</span></div>
      <div class="dn"><span class="lab">Weakest supplier</span><b>${pct(worst.onTime)}</b><span class="d">${esc(worst.name)} on time</span></div>
      <div class="dn"><span class="lab">Not yet ordered</span><b>${late.length}</b><span class="d">Long-lead items still open</span></div>
      <div class="up"><span class="lab">Settlement discount</span><b>${pct(S.suppliers.reduce((a,s)=>a+s.discount,0)/S.suppliers.length)}</b><span class="d">Average available on terms</span></div>
    </div>

    <div class="sec"><span class="lab">Open adjudications</span><span class="lab">Three quotes, and why</span></div>
    ${tbl([["Item"],["Project"],["Lowest","n"],["Chosen","n"],["Highest","n"],["Reason"]],
      S.adjudications.map(a=>`<tr class="click" data-p="${a.proj}">
        <td class="name">${esc(a.item)}</td><td>${esc(proj(a.proj).town)}</td>
        <td class="n">${R(a.low)}</td>
        <td class="n" style="font-weight:700">${R(a.chosen)}${a.chosen>a.low?`<span class="sub" style="color:var(--warn)">+${R(a.chosen-a.low)}</span>`:""}</td>
        <td class="n" style="color:var(--ink-3)">${R(a.high)}</td>
        <td style="color:var(--ink-2)">${esc(a.why)}</td></tr>`).join(""), 680)}

    <div class="sec"><span class="lab">Supplier performance</span></div>
    ${tbl([["Supplier"],["Category"],["On time","n"],["Defects","n"],["Discount","n"],["Lead wks","n"],["Record"]],
      S.suppliers.slice().sort((a,b)=>b.onTime-a.onTime).map(s=>{
        const sev = s.onTime>=0.9?"ok":s.onTime>=0.8?"warn":"crit";
        return `<tr><td class="name">${esc(s.name)}</td><td style="color:var(--ink-2)">${esc(s.cat)}</td>
          <td class="n"><span class="pill ${sev}">${pct(s.onTime)}</span></td>
          <td class="n" style="color:var(--${s.defects>4?"crit":s.defects?"warn":"ok"})">${s.defects}</td>
          <td class="n">${s.discount?pct(s.discount):"&ndash;"}</td><td class="n">${s.lead}</td>
          <td style="width:140px">${meter(s.onTime*100, sev)}</td></tr>`;}).join(""), 680)}
    <p class="foot-note">Bekker Plumbing sits at 62% on time with seven defects, and is the sub-contractor currently on a default notice at Menlyn. That is the same fact reaching head office and the site from opposite directions.</p>

    <div class="sec"><span class="lab">Expediting</span><span class="lab">Order-by date derived from lead time</span></div>
    ${tbl([["Item"],["Project"],["Needed on","n"],["Lead wks","n"],["Order by","n"],["Status"]],
      S.expedite.map(e=>{
        const by = new Date(D(e.need)); by.setDate(by.getDate() - e.lead*7);
        const wd = workdaysBetween(TODAY, by);
        return `<tr class="click" data-p="${e.proj}">
          <td class="name">${esc(e.item)}</td><td>${esc(proj(e.proj).town)}</td>
          <td class="n">${esc(fmt(D(e.need)))}</td><td class="n">${e.lead}</td>
          <td class="n">${esc(fmt(by))} <span class="sub">${wd<0?Math.abs(wd)+" wd late":wd+" wd"}</span></td>
          <td>${e.ordered?`<span class="pill ok">Ordered</span>`:`<span class="pill ${wd<0?"crit":"warn"}">${wd<0?"Overdue":"Open"}</span>`}</td>
        </tr>`;}).join(""), 700)}`;
}

/* ---------------- 03 Site productivity ---------------- */
function vSite(){
  const avgCap = S.projects.reduce((a,p)=>a+(p.capture===0?1:0),0);
  const totRework = S.projects.reduce((a,p)=>a+p.rework,0);
  const rfi = S.projects.reduce((a,p)=>a+p.rfiOpen,0);
  head("Site productivity", "Daily capture, labour and plant signals, progress and rework, access to information", "03 Value area");
  return `
    <div class="kpis">
      <div class="${avgCap===S.projects.length?"up":"dn"}"><span class="lab">Captured today</span><b>${avgCap}/${S.projects.length}</b><span class="d">Sites that logged today</span></div>
      <div class="dn"><span class="lab">Rework open</span><b>${totRework}</b><span class="d">Items across all sites</span></div>
      <div class="dn"><span class="lab">RFIs open</span><b>${rfi}</b><span class="d">Waiting on information</span></div>
      <div class="dn"><span class="lab">Labour over allowable</span><b>${S.projects.filter(p=>p.labourAct>100).length}</b><span class="d">Of ${S.projects.length} sites</span></div>
    </div>

    <div class="sec"><span class="lab">By site</span><span class="lab">Signals captured on the phone, not chased by the office</span></div>
    ${tbl([["Project"],["Last capture","n"],["Labour vs allowable","n"],[""],["Rework","n"],["RFIs open","n"],["Control points"]],
      S.projects.map(p=>{
        const capSev = p.capture===0?"ok":p.capture<=3?"warn":"crit";
        const labSev = p.labourAct>105?"crit":p.labourAct>100?"warn":"ok";
        return `<tr class="click" data-p="${p.id}">
          <td class="name">${esc(p.name)}<span class="sub">${esc(p.agent)}</span></td>
          <td class="n"><span class="pill ${capSev}">${p.capture===0?"today":p.capture+" d ago"}</span></td>
          <td class="n" style="color:var(--${labSev})">${p.labourAct}%</td>
          <td style="width:130px">${meter(p.labourAct*0.8, labSev)}</td>
          <td class="n" style="color:var(--${p.rework>5?"crit":p.rework?"warn":"ok"})">${p.rework}</td>
          <td class="n">${p.rfiOpen}</td>
          <td>${cpMeter(p)}</td></tr>`;}).join(""), 760)}
    <p class="foot-note">Rosslyn has not been captured in twenty-one days and is running 18% over allowable labour. Those two numbers are the same problem: the site that stops reporting is the site that has stopped being managed, and the cost only shows up at final account.</p>`;
}

/* ---------------- 04 Commercial ---------------- */
function vCommercial(){
  const t = totals();
  const ctc = S.projects.reduce((a,p)=>a+p.ctc,0);
  const atRisk = S.projects.filter(p=>p.nowMargin<p.baseMargin).reduce((a,p)=>a+(p.baseMargin-p.nowMargin)/100*p.value,0);
  head("Commercial", "Cost-to-complete, variations, claims, cash and margin at risk", "04 Value area");
  return `
    <div class="kpis">
      <div><span class="lab">Cost to complete</span><b>${Rm(ctc)}</b><span class="d">Across ${S.projects.length} projects</span></div>
      <div class="dn"><span class="lab">Margin at risk</span><b>${R(atRisk)}</b><span class="d">Value of the drift against tender</span></div>
      <div><span class="lab">Certified</span><b>${Rm(t.certified)}</b><span class="d">${Rm(t.v-t.certified)} still to certify</span></div>
      <div class="dn"><span class="lab">Overdue value</span><b>${R(t.overdue)}</b><span class="d">Past a contractual window</span></div>
      <div class="dn"><span class="lab">Contra open</span><b>${R(S.projects.reduce((a,p)=>a+p.contra,0))}</b><span class="d">Deduct before the next certificate</span></div>
    </div>

    <div class="sec"><span class="lab">Cash and margin by project</span></div>
    ${tbl([["Project"],["Contract","n"],["Certified","n"],["Outstanding","n"],["Cost to complete","n"],["Retention","n"],["Contra","n"],["Margin","n"]],
      S.projects.map(p=>{const dm=p.nowMargin-p.baseMargin;
        return `<tr class="click" data-p="${p.id}">
          <td class="name">${esc(p.name)}</td>
          <td class="n">${R(p.value)}</td><td class="n">${R(p.certified)}</td>
          <td class="n">${R(p.value-p.certified)}</td><td class="n">${R(p.ctc)}</td>
          <td class="n">${R(p.retention)}</td>
          <td class="n" style="color:var(--${p.contra?"crit":"ink-3"})">${p.contra?R(p.contra):"&ndash;"}</td>
          <td class="n" style="color:var(--${dm>=0?"ok":"crit"})">${p.nowMargin.toFixed(1)}%<span class="sub">${dm>=0?"+":""}${dm.toFixed(1)}</span></td>
        </tr>`;}).join(""), 860)}

    <div class="sec"><span class="lab">Variations and claims</span></div>
    ${outsTable(S.outputs.filter(o=>["Variation","Claim","Final account"].includes(o.type)), true)}
    <p class="foot-note">Margin is measured against the price each job was won at, never against a revised internal budget. A budget that moves with the job cannot tell you the job is losing money.</p>`;
}

/* ---------------- 05 Programme ---------------- */
function vProgramme(){
  const slipped = S.projects.filter(p=>D(p.pcNow)>D(p.pcBase));
  const exposure = S.critical.reduce((a,c)=>a+c.exposure,0);
  head("Programme", "Early warning, critical-path exposure, recovery scenarios", "05 Value area");
  return `
    <div class="kpis">
      <div class="${slipped.length?"dn":"up"}"><span class="lab">Projects slipped</span><b>${slipped.length}/${S.projects.length}</b><span class="d">Forecast past the baseline date</span></div>
      <div class="dn"><span class="lab">Critical path exposure</span><b>${R(exposure)}</b><span class="d">${S.critical.filter(c=>c.float<=0).length} activities at or past zero float</span></div>
      <div class="dn"><span class="lab">Early warnings</span><b>${S.warnings.length}</b><span class="d">Open across the portfolio</span></div>
      <div class="up"><span class="lab">Recovery options</span><b>${S.recovery.length}</b><span class="d">Priced and ready to choose</span></div>
    </div>

    <div class="sec"><span class="lab">Early warning</span><span class="lab">Raised from site, not found in a month-end review</span></div>
    ${tbl([["Signal"],["Project"],["Days","n"],["Cost","n"],["Owner"]],
      S.warnings.map(w=>`<tr class="click" data-p="${w.proj}">
        <td class="name">${esc(w.signal)}</td><td>${esc(proj(w.proj).town)}</td>
        <td class="n">${w.days?`<span class="pill warn">${w.days} wd</span>`:"&ndash;"}</td>
        <td class="n" style="color:var(--crit)">${R(w.cost)}</td>
        <td>${esc(w.owner)}</td></tr>`).join(""), 620)}

    <div class="sec"><span class="lab">Critical path</span></div>
    ${tbl([["Activity"],["Project"],["Float","n"],["Exposure","n"],["Programme"]],
      S.critical.map(c=>{const p=proj(c.proj);
        return `<tr class="click" data-p="${c.proj}">
          <td class="name">${esc(c.act)}</td><td>${esc(p.town)}</td>
          <td class="n"><span class="pill ${c.float<0?"crit":c.float===0?"warn":"ok"}">${c.float>0?"+":""}${c.float} d</span></td>
          <td class="n">${c.exposure?R(c.exposure):"&ndash;"}</td>
          <td style="width:170px">${p.start?progBar(p):""}</td></tr>`;}).join(""), 660)}

    <div class="sec"><span class="lab">Recovery scenarios</span><span class="lab">What each option is actually worth</span></div>
    ${tbl([["Option"],["Project"],["Days recovered","n"],["Cost","n"],["Net","n"]],
      S.recovery.map(r=>`<tr class="click" data-p="${r.proj}">
        <td class="name">${esc(r.option)}</td><td>${esc(proj(r.proj).town)}</td>
        <td class="n">${r.days}</td><td class="n">${r.cost?R(r.cost):"&ndash;"}</td>
        <td class="n" style="color:var(--${r.net>=0?"ok":"crit"});font-weight:700">${r.net>=0?"+":""}${R(r.net)}</td>
      </tr>`).join(""), 620)}
    <p class="foot-note">The second option at Menlyn recovers nothing on site and is worth more than the first, because four days claimed as an extension carries the time-related preliminaries with it. Recovery is a commercial decision before it is a programme one.</p>`;
}

      <div><span class="lab">Benchmarks held</span><b>${S.benchmarks.length}</b><span class="d">Building types with a rate</span></div>
