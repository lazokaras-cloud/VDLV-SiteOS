<title>Company overview</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;0,900;1,400&display=swap">

<style>
:root{
  --ground:#F1F1F1; --surface:#FFFFFF; --surface-2:#F7F7F4; --surface-3:#EDEDE8;
  --ink:#111111; --ink-2:#5A5A56; --ink-3:#8C8C87;
  --rule:#DCDCD6; --rule-2:#EAEAE4;
  --signal:#FFCB05; --signal-ink:#0C0C0C; --signal-txt:#7A5E00;
  --stamp:#5A5A56; --stamp-wash:#F0EDE3;
  --ok:#2E7D4F; --ok-wash:#E6F2EA;
  --warn:#B2740B; --warn-wash:#FAF0DA;
  --crit:#C0392B; --crit-wash:#FBE7E4;
  --shadow:0 1px 2px rgba(16,19,23,.05), 0 8px 24px rgba(16,19,23,.07);
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Roboto Mono",Menlo,monospace;
  --sans:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0C0C0C; --surface:#151515; --surface-2:#1D1D1C; --surface-3:#262624;
    --ink:#F2F2EF; --ink-2:#A0A09B; --ink-3:#74746F;
    --rule:#2C2C2A; --rule-2:#212120;
    --signal:#FFCB05; --signal-ink:#0C0C0C; --signal-txt:#FFCB05;
    --stamp:#A0A09B; --stamp-wash:#241E08;
    --ok:#46B87A; --ok-wash:#14261B;
    --warn:#E0A93C; --warn-wash:#2A2214;
    --crit:#E4695C; --crit-wash:#2C1A18;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#0C0C0C; --surface:#151515; --surface-2:#1D1D1C; --surface-3:#262624;
  --ink:#F2F2EF; --ink-2:#A0A09B; --ink-3:#74746F;
  --rule:#2C2C2A; --rule-2:#212120;
  --signal:#FFCB05; --signal-ink:#0C0C0C; --signal-txt:#FFCB05;
  --stamp:#A0A09B; --stamp-wash:#241E08;
  --ok:#46B87A; --ok-wash:#14261B;
  --warn:#E0A93C; --warn-wash:#2A2214;
  --crit:#E4695C; --crit-wash:#2C1A18;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
:focus-visible{outline:2px solid var(--signal-txt); outline-offset:2px}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}

.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}

.top{
  padding:18px 28px; border-bottom:1px solid var(--rule); background:var(--surface);
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  position:sticky; top:0; z-index:10;
}
.mast{display:flex; align-items:center; gap:16px; min-width:0}
.w{
  display:flex; align-items:baseline; gap:8px; font-size:22px; font-weight:700;
  letter-spacing:.02em; padding-right:16px; border-right:1px solid var(--rule); flex:none;
}
.w b{font-weight:700; color:var(--signal-txt)}
.w i{
  width:8px; height:8px; border:2px solid var(--signal); border-radius:50%;
  display:inline-block; flex:none; transform:translateY(-1px);
}
.top h1{margin:0; font-size:24px; font-weight:700; letter-spacing:-.01em; line-height:1.15}
.top .sub{margin:3px 0 0; font-size:13px; color:var(--ink-2)}
.sp{flex:1}
.stamp{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); border:1px solid var(--rule); padding:5px 9px; border-radius:5px;
  white-space:nowrap;
}
.tools{display:flex; align-items:center; gap:8px}
.tools button{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-2); border:1px solid var(--rule); border-radius:6px; padding:8px 12px;
  min-height:44px;
}
.tools button:hover{border-color:var(--ink); color:var(--ink)}
.tools .langbtn{min-width:44px; text-align:center}
.tools .langbtn.af{border-color:var(--signal); color:var(--signal-txt)}
a.w{color:inherit; text-decoration:none}
.jump{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  border:1px solid var(--ink); border-radius:6px; padding:8px 12px; min-height:44px;
  display:inline-flex; align-items:center; color:var(--ink);
}
.jump:hover{background:var(--signal); color:var(--signal-ink); border-color:#0C0C0C}

.body{padding:24px 28px 60px}

.card{
  background:var(--surface); border:1px solid var(--rule); border-radius:4px;
  box-shadow:var(--shadow); overflow:auto; max-height:calc(100dvh - 132px);
}
table{border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; font-size:13.5px}
th,td{
  padding:10px 12px; text-align:left; border-bottom:1px solid var(--rule-2);
  vertical-align:middle;
}
td{white-space:nowrap}
th{
  font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; background:var(--surface-2);
  border-bottom:1px solid var(--rule); white-space:nowrap; line-height:1.3;
  vertical-align:bottom;
}
thead tr.bands th{
  position:sticky; top:0; z-index:6;
  text-align:left; color:var(--ink); background:var(--surface);
  letter-spacing:.14em; padding:9px 14px; border-bottom:0; white-space:nowrap;
  font-size:11px; vertical-align:middle;
  box-shadow:inset 0 3px 0 var(--signal);
}
thead tr.cols th{position:sticky; top:2.2rem; z-index:5}
thead tr.bands th + th, th.g, td.g{border-left:2px solid var(--rule)}
th.grp-p, td.grp-p{background:rgba(255,203,5,.14)}
th.grp-s, td.grp-s{background:rgba(90,90,86,.08)}
th.sticky, td.sticky{
  position:sticky; left:0; z-index:4; min-width:5.4rem;
  background:var(--surface);
}
th.sticky2, td.sticky2{
  position:sticky; left:5.4rem; z-index:4; min-width:13rem;
  background:var(--surface);
  box-shadow:8px 0 12px rgba(16,19,23,.06);
}
thead tr.cols th.sticky, thead tr.cols th.sticky2{z-index:7; background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--stamp-wash)}
tbody tr:hover td.grp-p{background:rgba(255,203,5,.28)}
tbody tr:hover td.sticky, tbody tr:hover td.sticky2{background:var(--stamp-wash)}
td.n, th.n{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right}
td.name{font-weight:600}
td.neg{color:var(--crit)}
td.mid, th.mid{text-align:center}
.muted{color:var(--ink-3)}

.pill{
  display:inline-flex; align-items:center; gap:5px; padding:2.5px 8px; border-radius:20px;
  font-family:var(--mono); font-size:10.5px; font-weight:600; font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.pill.ok{background:var(--ok-wash); color:var(--ok)}
.pill.warn{background:var(--warn-wash); color:var(--warn)}
.pill.crit{background:var(--crit-wash); color:var(--crit)}
.pill.flat{background:var(--surface-3); color:var(--ink-2)}

tfoot td{
  background:var(--surface-2); font-weight:700;
  border-top:1px solid var(--rule); border-bottom:0;
}
tfoot td.sticky, tfoot td.sticky2{background:var(--surface-2); z-index:4}

th.sortable{cursor:pointer; user-select:none}
th.sortable:hover{color:var(--ink)}
th.sorted{color:var(--signal-txt)}
th.sorted::after{content:" \2191"}
th.sorted.desc::after{content:" \2193"}

.foot-note{margin-top:18px; font-size:12px; color:var(--ink-3); line-height:1.55; max-width:88ch}
.loadbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 14px}
.loadbar input{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.loadbar button{cursor:pointer}
.empty-note{padding:28px 16px; color:var(--ink-2); font-size:15px; line-height:1.45}

#toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:200;
  background:var(--ink); color:var(--ground); padding:10px 16px; border-radius:4px;
  font-size:13.5px; box-shadow:0 8px 30px rgba(0,0,0,.35);
}
#toast[hidden]{display:none}

@media (max-width:720px){
  .top{padding:14px 16px; position:static}
  .body{padding:16px 16px 48px}
  .mast{align-items:flex-start}
  .w{border-right:0; padding-right:0}
}
</style>

<header class="top">
  <div class="mast">
    <a class="w" href="/"><span id="brand">Site<b>OS</b></span><i></i></a>
    <div>
      <h1 id="title">Company overview</h1>
      <p class="sub" id="sub">Load a cost dump for the contracts director.</p>

  </div>
  <span class="sp"></span>

    <a class="jump" href="/plumbline" id="to-app">Project app</a>

  </div>

<main class="body">
  <div class="card" id="setup" style="max-height:none;margin-bottom:14px;padding:16px 16px 8px"></div>

<div id="toast" hidden></div>

<script>
"use strict";

/* Company overview. The sheet starts empty.
   Money in a loaded file is rand amounts, stored here as integer cents.
   The sign-off target is the only date this page derives, and it is
   ordinary calendar arithmetic, not a contract clause.
   Percentages are not totalled. */

// SiteOS Rev 4 company overview, "Sign-off target date (90 days after practical or works completion)".
// The 90 is calendar arithmetic on a date in the loaded row, not a contract clause.
const SIGN_OFF_AFTER_PRACTICAL = 90;
const WS_KEY = "siteos.workspace";

const MONEY = [
  ["priceExcl", "Contract price excl. VAT"],
  ["priceIncl", "Contract price incl. VAT"],
  ["accruals", "Accruals"],
  ["thisPeriod", "This period"],
  ["adjustments", "Adjustments / advance payments"],
  ["cumulative", "Cumulative"],
  ["negative", "Negative projects"],
  ["contractCost", "Contract cost"]
];

/* Rows come from a CSV the person loads. Nothing is shipped as live data. */
let ROWS = [];

const THIN = "\u202F";
const MON_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MON_AF = ["Jan","Feb","Mrt","Apr","Mei","Jun","Jul","Aug","Sep","Okt","Nov","Des"];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function formatRand(cents){
  const n = Math.trunc(cents);
  const sign = n < 0 ? "-" : "";
  const abs = Math.abs(n);
  const rands = Math.trunc(abs / 100);
  const frac = abs % 100;
  const body = String(rands).replace(/\B(?=(\d{3})+(?!\d))/g, THIN);
  return sign + "R" + body + (frac ? "." + String(frac).padStart(2, "0") : "");
}

function formatDate(iso){
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  const mon = (LANG === "af" ? MON_AF : MON_EN)[m - 1];
  return d + " " + mon + " " + y;
}

function isLeap(y){
  return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
}
function daysInMonth(y, m){
  return [31, isLeap(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
}
function addCalendarDays(iso, days){
  let [y, m, d] = iso.split("-").map(Number);
  let left = days;
  while (left > 0){
    const room = daysInMonth(y, m) - d;
    if (left <= room){ d += left; left = 0; break; }
    left -= room + 1;
    d = 1;
    m += 1;
    if (m > 12){ m = 1; y += 1; }
  }
  while (left < 0){
    if (d + left >= 1){ d += left; left = 0; break; }
    left += d;
    m -= 1;
    if (m < 1){ m = 12; y -= 1; }
    d = daysInMonth(y, m);
  }
  return y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
}

function signOffTarget(practicalIso){
  return addCalendarDays(practicalIso, SIGN_OFF_AFTER_PRACTICAL);
}

/* Whole calendar days from the sign-off target to the company reporting date.
   Sheet column: days delay between sign-off and the reporting date.
   The closure meeting is shown on the row and is not this end date.
   Does not call new Date(). */
function dayNumber(iso){
  const [y, m, d] = iso.split("-").map(Number);
  return Math.round(Date.UTC(y, m - 1, d) / 86400000);
}
function daysOfDelay(targetIso, asAt){
  return dayNumber(asAt) - dayNumber(targetIso);
}

function sumCents(key){
  let any = false;
  let n = 0;
  for (const row of ROWS){
    const v = row[key];
    if (typeof v === "number"){ any = true; n += v; }
  }
  return any ? n : null;
}

let LANG = "en";
try {
  const stored = localStorage.getItem("siteos.lang");
  if (stored === "af" || stored === "en") LANG = stored;
} catch (e) {}

const AF = {
  /* Technical nouns stay English on purpose: accruals, practical completion, sign-off, BuildSmart. */
  "Company overview": "Maatskappy oorsig",
  "One sheet for the contracts director.": "Een blad vir die kontrakte direkteur.",
  "Theme": "Tema",
  "As at": "Soos op",
  "Project profitability": "Projek profit",
  "Project sign-off": "Projek sign-off",
  "BuildSmart dump": "BuildSmart dump",
  "Project no.": "Projek no.",
  "Project": "Projek",
  "Contracts director": "Kontrakte direkteur",
  "Contract price excl. VAT": "Kontrak prys excl. VAT",
  "Contract price incl. VAT": "Kontrak prys incl. VAT",
  "Accruals": "Accruals",
  "Adjustments / advance payments": "Adjustments / advance payments",
  "This period": "Hierdie periode",
  "Cumulative": "Kumulatief",
  "Negative projects": "Negatiewe projekte",
  "Contract cost": "Kontrak koste",
  "Actual profit %": "Werklike profit %",
  "Tender target profit %": "Tender target profit %",
  "Practical completion": "Practical completion",
  "Sign-off target": "Sign-off target",
  "Closure meeting": "Closure meeting",
  "Project app": "Projek-app",
  "Below target": "Onder target",
  "Above target": "Bo target",
  "Days of delay": "Dae vertraging",
  "Total": "Totaal",
  "Yes": "Ja",
  "Load a cost dump for the contracts director.": "Laai 'n cost dump vir die kontrakte direkteur.",
  "Load a CSV": "Laai 'n CSV",
  "Blank CSV": "Leë CSV",
  "No dump loaded. Load a CSV, or take the blank one and fill it.": "Geen dump gelaai nie. Laai 'n CSV, of vat die leë een en vul dit.",
  "Dump loaded": "Dump gelaai",
  "That file has headers and no rows.": "Daai lêer het headers en geen rye nie.",
  "That CSV could not be read.": "Daai CSV kon nie gelees word nie.",
  "Load a BuildSmart dump. If the sign-off target cell is empty and a practical completion date is present, the target is 90 calendar days after that date. Days of delay are whole days from that target to the as-at date. Percentages are not totalled.":
    "Laai 'n BuildSmart dump. As die sign-off target sel leeg is en daar is 'n practical completion datum, is die target 90 kalenderdae ná daai datum. Dae vertraging is volle dae van daai target tot die as-at datum. Persentasies word nie bymekaar getel nie.",
  "Required headers: Project number and name, Practical completion date. Project and PC date are accepted names. If the sign-off target cell is empty and a practical completion date is present, the target is 90 calendar days after that date. Days of delay use the reporting date. Percentages are not totalled.":
    "Vereiste headers: Project number and name, Practical completion date. Project en PC date word aanvaar. As die sign-off target sel leeg is en daar is 'n practical completion datum, is die target 90 kalenderdae ná daai datum. Dae vertraging gebruik die reporting date. Persentasies word nie bymekaar getel nie.",
  "The reporting date is missing.": "Die reporting date is weg.",
  "Company name": "Maatskappy naam",
  "Reporting date": "Soos-op datum",
  "Keep the company": "Hou die maatskappy",
  "The company needs a name.": "Die maatskappy het 'n naam nodig.",
  "Set the reporting date.": "Sit die reporting date.",
  "Company kept": "Maatskappy gehou",
  "Download workspace": "Laai die werkspasie af",
  "Load workspace": "Laai die werkspasie",
  "This replaces the workspace on this computer.": "Dit vervang die werkspasie op hierdie rekenaar.",
  "Replace the workspace": "Vervang die werkspasie",
  "Cancel": "Kanselleer",
  "Workspace loaded": "Werkspasie gelaai",
  "That file is not a workspace.": "Daai lêer is nie 'n werkspasie nie.",
  "Missing header": "Header weg",
  "Day counts use this reporting date.": "Dag-tellings gebruik hierdie reporting date."
};

function tr(s){
  if (LANG !== "af") return s;
  return AF[s] || s;
}

function translateDOM(root){
  if (!root || LANG !== "af") return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes){
    const raw = n.nodeValue;
    const k = raw.trim();
    if (!k || /^[\d\s.,%+\-/]*$/.test(k)) continue;
    const out = tr(k);
    if (out !== k) n.nodeValue = raw.replace(k, out);
  }
}

const NOTE = "Required headers: Project number and name, Practical completion date. Project and PC date are accepted names. If the sign-off target cell is empty and a practical completion date is present, the target is 90 calendar days after that date. Days of delay use the reporting date. Percentages are not totalled.";

function flag(on, kind){
  if (!on) return `<span class="muted">\u2014</span>`;
  return `<span class="pill ${kind}">Yes</span>`;
}

function delayPill(n){
  const kind = n > 0 ? "crit" : n === 0 ? "warn" : "flat";
  return `<span class="pill ${kind}">${n}</span>`;
}

function moneyCell(cents){
  if (typeof cents !== "number") return `<td class="n" data-sort=""><span class="muted">\u2014</span></td>`;
  const neg = cents < 0 ? " neg" : "";
  return `<td class="n${neg}" data-sort="${cents}">${formatRand(cents)}</td>`;
}
function pctNum(s){
  const t = String(s || "").trim().replace("%", "").replace(",", ".");
  if (!/^-?\d+(\.\d+)?$/.test(t)) return null;
  return Number(t);
}
function yesCell(raw){
  const s = String(raw || "").trim().toLowerCase();
  if (!s) return null;
  if (s === "yes" || s === "ja" || s === "y" || s === "true" || s === "1") return true;
  if (s === "no" || s === "nee" || s === "n" || s === "false" || s === "0") return false;
  return null;
}
function pctText(s){
  const raw = String(s || "").trim();
  if (!raw) return `<span class="muted">\u2014</span>`;
  if (raw.endsWith("%")) return esc(raw);
  if (/^-?\d+([.,]\d+)?$/.test(raw)) return esc(raw) + "%";
  return esc(raw);
}
function rowTarget(row){
  if (row.signOff && /^\d{4}-\d{2}-\d{2}$/.test(row.signOff)) return row.signOff;
  if (row.practicalCompletion && /^\d{4}-\d{2}-\d{2}$/.test(row.practicalCompletion)) return signOffTarget(row.practicalCompletion);
  return "";
}

function sheet(){
  if (!ROWS.length){
    return `<div class="empty-note">${esc(tr("No dump loaded. Load a CSV, or take the blank one and fill it."))}</div>`;
  }
  const band = `<tr class="bands">
      <th class="dump" colspan="${3 + MONEY.length}">BuildSmart dump</th>
      <th class="profit" colspan="4">Project profitability</th>
      <th class="sign" colspan="4">Project sign-off</th>
    </tr>`;
  const cols = `<tr class="cols">
      <th class="sticky">Project no.</th>
      <th class="sticky2">Project</th>
      <th>Contracts director</th>
      ${MONEY.map(([, label]) => `<th class="n">${esc(label)}</th>`).join("")}
      <th class="n g grp-p">Actual profit %</th>
      <th class="n grp-p">Tender target profit %</th>
      <th class="mid grp-p">Below target</th>
      <th class="mid grp-p">Above target</th>
      <th class="g grp-s">Practical completion</th>
      <th class="grp-s">Sign-off target</th>
      <th class="grp-s">Closure meeting</th>
      <th class="n grp-s">Days of delay</th>
    </tr>`;

  const body = ROWS.map((row) => {
    const target = rowTarget(row);
    const asAt = reportingDate();
    const delay = target && asAt ? daysOfDelay(target, asAt) : null;
    const actual = pctNum(row.actualProfitPct);
    const tenderPct = pctNum(row.tenderProfitPct);
    let below = yesCell(row.below);
    let above = yesCell(row.above);
    if (below == null && above == null && actual != null && tenderPct != null){
      below = actual < tenderPct;
      above = actual > tenderPct;
    }
    const money = MONEY.map(([key]) => moneyCell(row[key])).join("");
    const meeting = row.closureMeeting
      ? `<td data-sort="${esc(row.closureMeeting)}">${esc(formatDate(row.closureMeeting))}</td>`
      : `<td data-sort=""><span class="muted">\u2014</span></td>`;
    const practical = row.practicalCompletion
      ? `<td class="g grp-s" data-sort="${esc(row.practicalCompletion)}">${esc(formatDate(row.practicalCompletion))}</td>`
      : `<td class="g grp-s" data-sort=""><span class="muted">\u2014</span></td>`;
    const sign = target
      ? `<td class="grp-s" data-sort="${esc(target)}">${esc(formatDate(target))}</td>`
      : `<td class="grp-s" data-sort=""><span class="muted">\u2014</span></td>`;
    const delayCell = !asAt
      ? `<td class="n grp-s" data-sort="">${esc(tr("The reporting date is missing."))}</td>`
      : delay == null
      ? `<td class="n grp-s" data-sort=""><span class="muted">\u2014</span></td>`
      : `<td class="n grp-s" data-sort="${delay}">${delayPill(delay)}</td>`;
    return `<tr>
      <td class="mono sticky" data-sort="${esc(row.no)}">${esc(row.no)}</td>
      <td class="name sticky2" data-sort="${esc(row.name)}">${esc(row.name)}</td>
      <td data-sort="${esc(row.director)}">${esc(row.director)}</td>
      ${money}
      <td class="n g grp-p" data-sort="${esc(row.actualProfitPct || "")}">${pctText(row.actualProfitPct)}</td>
      <td class="n grp-p" data-sort="${esc(row.tenderProfitPct || "")}">${pctText(row.tenderProfitPct)}</td>
      <td class="mid grp-p" data-sort="${below ? 1 : 0}">${flag(!!below, "warn")}</td>
      <td class="mid grp-p" data-sort="${above ? 1 : 0}">${flag(!!above, "ok")}</td>
      ${practical}
      ${sign}
      ${meeting.replace("<td ", "<td class=\"grp-s\" ")}
      ${delayCell}
    </tr>`;
  }).join("");

  const totals = MONEY.map(([key]) => {
    const cents = sumCents(key);
    if (cents == null) return `<td class="n"></td>`;
    const neg = cents < 0 ? " neg" : "";
    return `<td class="n${neg}">${formatRand(cents)}</td>`;
  }).join("");

  return `<table>
    <thead>${band}${cols}</thead>
    <tbody>${body}</tbody>
    <tfoot><tr>
      <td class="sticky">Total</td>
      <td class="sticky2"></td>
      <td></td>
      ${totals}
      <td class="g grp-p"></td><td class="grp-p"></td><td class="grp-p"></td><td class="grp-p"></td>
      <td class="g grp-s"></td><td class="grp-s"></td><td class="grp-s"></td><td class="grp-s"></td>
    </tr></tfoot>
  </table>`;
}

function cellKey(td){
  const raw = td.getAttribute("data-sort");
  if (raw === null || raw === "") return {kind:"s", v:""};
  if (/^-?\d+(\.\d+)?$/.test(raw)) return {kind:"n", v:Number(raw)};
  return {kind:"s", v:raw.toLowerCase()};
}

function makeSortable(table){
  const head = table.tHead;
  if (!head || head.rows.length < 2) return;
  [...head.rows[1].cells].forEach((th, i) => {
    th.classList.add("sortable");
    th.onclick = () => {
      const body = table.tBodies[0];
      const rows = [...body.rows];
      const dir = th.classList.contains("sorted") && !th.classList.contains("desc") ? -1 : 1;
      [...head.rows[1].cells].forEach((c) => {
        c.classList.remove("sorted", "desc");
        c.removeAttribute("aria-sort");
      });
      th.classList.add("sorted");
      if (dir < 0) th.classList.add("desc");
      th.setAttribute("aria-sort", dir < 0 ? "descending" : "ascending");
      rows.sort((a, b) => {
        const x = cellKey(a.cells[i]);
        const y = cellKey(b.cells[i]);
        let cmp;
        if (x.kind === "n" && y.kind === "n") cmp = x.v - y.v;
        else cmp = x.v < y.v ? -1 : x.v > y.v ? 1 : 0;
        return cmp * dir;
      });
      rows.forEach((r) => body.appendChild(r));
    };
  });
}

const CSV_HEADERS = [
  "Project number", "Project name", "Contracts director",
  "Contract price excl VAT", "Contract price incl VAT", "Accruals", "This period",
  "Adjustments/advance payments", "Cumulative", "Negative projects", "Contract cost",
  "Actual profit percent", "Tender target profit percent", "Below target", "Above target",
  "Practical completion date", "Sign-off target date", "Actual closure meeting date"
];
const STORE = "siteos.office.dump";

function normHead(h){
  return String(h || "").toLowerCase().replace(/[%().]/g, " ").replace(/[/_-]/g, " ").replace(/\s+/g, " ").trim();
}
function randsToCents(raw){
  let s = String(raw == null ? "" : raw).trim().replace(/[\u00a0\u202f\s]/g, "").replace(/^R/i, "");
  if (!s) return null;
  let neg = false;
  if (s[0] === "-"){ neg = true; s = s.slice(1); }
  if (s[0] === "(" && s.endsWith(")")){ neg = true; s = s.slice(1, -1); }
  const lastComma = s.lastIndexOf(",");
  const lastDot = s.lastIndexOf(".");
  let whole = s;
  let dec = "";
  if (lastComma >= 0 && lastDot >= 0){
    const cut = Math.max(lastComma, lastDot);
    whole = s.slice(0, cut).replace(/[.,]/g, "");
    dec = s.slice(cut + 1);
  } else if (lastComma >= 0 || lastDot >= 0){
    const cut = lastComma >= 0 ? lastComma : lastDot;
    const after = s.slice(cut + 1);
    const only = s.indexOf(s[cut]) === cut;
    if (only && after.length <= 2 && /^\d+$/.test(after)){
      whole = s.slice(0, cut).replace(/[.,]/g, "");
      dec = after;
    } else whole = s.replace(/[.,]/g, "");
  }
  if (!/^\d+$/.test(whole) || (dec && !/^\d+$/.test(dec))) return null;
  const cents = Number(whole) * 100 + Number((dec + "00").slice(0, 2));
  if (!Number.isSafeInteger(cents)) return null;
  return neg ? -cents : cents;
}
function parseCsv(text){
  const rows = [];
  let row = [];
  let cell = "";
  let q = false;
  const s = String(text || "").replace(/^\uFEFF/, "");
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (q){
      if (c === '"'){
        if (s[i + 1] === '"'){ cell += '"'; i++; }
        else q = false;
      } else cell += c;
    } else if (c === '"') q = true;
    else if (c === ","){ row.push(cell); cell = ""; }
    else if (c === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (c !== "\r") cell += c;
  }
  if (cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((c) => String(c).trim()));
}
function rowsFrom(text){
  const table = parseCsv(text);
  if (!table.length) return null;
  const headers = table[0].map((h) => ({ n: normHead(h), used: false }));
  const take = (pred) => {
    for (let i = 0; i < headers.length; i++){
      if (headers[i].used) continue;
      if (pred(headers[i].n)){ headers[i].used = true; return i; }
    }
    return -1;
  };
  const combined = take((h) => h === "project" || h.includes("project number and name"));
  const ix = {
    combined: combined,
    no: take((h) => h.includes("project number") || h.startsWith("project no")),
    name: take((h) => h.includes("project name")),
    director: take((h) => h.includes("director")),
    priceExcl: take((h) => h.includes("excl")),
    priceIncl: take((h) => h.includes("incl")),
    accruals: take((h) => h.includes("accrual")),
    thisPeriod: take((h) => h.includes("this period")),
    adjustments: take((h) => h.includes("adjustment")),
    cumulative: take((h) => h === "cumulative" || h.startsWith("cumulative")),
    negative: take((h) => h.includes("negative")),
    contractCost: take((h) => h.includes("contract cost")),
    actualProfitPct: take((h) => h.includes("actual profit")),
    tenderProfitPct: take((h) => h.includes("tender target")),
    below: take((h) => h.includes("below")),
    above: take((h) => h.includes("above")),
    practicalCompletion: take((h) => h === "pc" || h === "pc date" || h.includes("practical")),
    signOff: take((h) => h.includes("sign off") || h.includes("signoff")),
    closureMeeting: take((h) => h.includes("closure"))
  };
  const missing = [];
  if (ix.combined < 0 && ix.no < 0 && ix.name < 0) missing.push("Project number and name");
  if (ix.practicalCompletion < 0) missing.push("Practical completion date");
  if (missing.length) return { missing: missing, rows: [] };
  const at = (cols, i) => (i < 0 || i >= cols.length) ? "" : String(cols[i] || "").trim();
  const iso = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : "";
  const money = (s) => {
    if (!s) return null;
    return randsToCents(s);
  };
  const out = [];
  for (let r = 1; r < table.length; r++){
    const cols = table[r];
    let no = at(cols, ix.no);
    let name = at(cols, ix.name);
    if (!name && ix.combined >= 0) name = at(cols, ix.combined);
    if (!no && !name) continue;
    if (/^total$/i.test(no) || /^total$/i.test(name)) continue;
    out.push({
      no: no,
      name: name,
      director: at(cols, ix.director),
      priceExcl: money(at(cols, ix.priceExcl)),
      priceIncl: money(at(cols, ix.priceIncl)),
      accruals: money(at(cols, ix.accruals)),
      thisPeriod: money(at(cols, ix.thisPeriod)),
      adjustments: money(at(cols, ix.adjustments)),
      cumulative: money(at(cols, ix.cumulative)),
      negative: money(at(cols, ix.negative)),
      contractCost: money(at(cols, ix.contractCost)),
      actualProfitPct: at(cols, ix.actualProfitPct),
      tenderProfitPct: at(cols, ix.tenderProfitPct),
      below: at(cols, ix.below),
      above: at(cols, ix.above),
      practicalCompletion: iso(at(cols, ix.practicalCompletion)),
      signOff: iso(at(cols, ix.signOff)),
      closureMeeting: iso(at(cols, ix.closureMeeting))
    });
  }
  return { missing: [], rows: out };
}

function emptyWs(){
  return {
    v: 1,
    company: { name: "", asAt: "" },
    seq: 1,
    focus: "list",
    screen: "list",
    openId: null,
    returnTo: "list",
    draft: null,
    tenders: [],
    projects: [],
    office: []
  };
}
function loadWs(){
  const ws = emptyWs();
  try {
    const raw = localStorage.getItem(WS_KEY);
    if (raw){
      const p = JSON.parse(raw);
      if (p && typeof p === "object"){
        ws.company = Object.assign({ name: "", asAt: "" }, p.company || {});
        ws.seq = p.seq || 1;
        ws.focus = p.focus || "list";
        ws.screen = p.screen || "list";
        ws.openId = p.openId || null;
        ws.returnTo = p.returnTo || "list";
        ws.draft = p.draft || null;
        ws.tenders = Array.isArray(p.tenders) ? p.tenders : [];
        ws.projects = Array.isArray(p.projects) ? p.projects : [];
        ws.office = Array.isArray(p.office) ? p.office : [];
        return ws;
      }
    }
    const dump = localStorage.getItem(STORE);
    if (dump){
      const rows = JSON.parse(dump);
      if (Array.isArray(rows)) ws.office = rows;
    }
  } catch (e) {}
  return ws;
}
function saveWs(ws){
  try { localStorage.setItem(WS_KEY, JSON.stringify(ws)); } catch (e) {}
}
function companyName(){
  return String(loadWs().company.name || "").trim();
}
function reportingDate(){
  const d = loadWs().company.asAt || "";
  return /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : "";
}
function saveRows(){
  const ws = loadWs();
  ws.office = ROWS;
  saveWs(ws);
}
function keepCompany(){
  const ws = loadWs();
  const name = $("#co-name").value.trim();
  const asAt = $("#co-asat").value;
  if (!name){ toast(tr("The company needs a name.")); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(asAt)){ toast(tr("Set the reporting date.")); return; }
  ws.company = { name: name, asAt: asAt };
  saveWs(ws);
  render();
  toast(tr("Company kept"));
}
function downloadWs(){
  const blob = new Blob([JSON.stringify(loadWs(), null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "siteos-workspace.json";
  a.click();
}
let pendingWs = null;
function showReplace(ws){
  pendingWs = ws;
  const box = $("#ws-confirm");
  box.hidden = false;
  box.innerHTML = `<p>${esc(tr("This replaces the workspace on this computer."))}</p>` +
    `<div class="loadbar"><button type="button" class="jump" id="ws-yes">${esc(tr("Replace the workspace"))}</button>` +
    `<button type="button" class="jump" id="ws-no">${esc(tr("Cancel"))}</button></div>`;
  $("#ws-yes").onclick = () => {
    saveWs(pendingWs);
    ROWS = Array.isArray(pendingWs.office) ? pendingWs.office : [];
    pendingWs = null;
    box.hidden = true;
    render();
    toast(tr("Workspace loaded"));
  };
  $("#ws-no").onclick = () => {
    pendingWs = null;
    box.hidden = true;
  };
}

ROWS = loadWs().office;

$("#template").onclick = () => {
  const blob = new Blob([CSV_HEADERS.join(",") + "\n"], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "company-overview.csv";
  a.click();
};
$("#csv").addEventListener("change", () => {
  const f = $("#csv").files && $("#csv").files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const parsed = rowsFrom(String(reader.result || ""));
    if (!parsed){ toast(tr("That CSV could not be read.")); return; }
    if (parsed.missing && parsed.missing.length){
      toast(tr("Missing header") + ": " + parsed.missing.join(", "));
      return;
    }
    ROWS = parsed.rows;
    saveRows();
    render();
    toast(tr(parsed.rows.length ? "Dump loaded" : "That file has headers and no rows."));
  };
  reader.readAsText(f);
  $("#csv").value = "";
});
$("#ws-down").onclick = downloadWs;
$("#ws-file").addEventListener("change", () => {
  const f = $("#ws-file").files && $("#ws-file").files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed = null;
    try { parsed = JSON.parse(String(reader.result || "")); } catch (e) { parsed = null; }
    if (!parsed || typeof parsed !== "object" || !Array.isArray(parsed.tenders) || !Array.isArray(parsed.projects)){
      toast(tr("That file is not a workspace."));
      return;
    }
    const ws = emptyWs();
    ws.company = Object.assign({ name: "", asAt: "" }, parsed.company || {});
    ws.tenders = parsed.tenders;
    ws.projects = parsed.projects;
    ws.office = Array.isArray(parsed.office) ? parsed.office : [];
    ws.seq = parsed.seq || 1;
    showReplace(ws);
  };
  reader.readAsText(f);
  $("#ws-file").value = "";
});

render();
</script>
