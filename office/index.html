<style>
:root{
  --ground:#F1F1F1; --surface:#FFFFFF; --surface-2:#F7F7F4; --surface-3:#EDEDE8;
  --ink:#111111; --ink-2:#5A5A56; --ink-3:#8C8C87;
  --rule:#DCDCD6; --rule-2:#EAEAE4;
  --signal:#FFCB05; --signal-ink:#0C0C0C; --signal-txt:#7A5E00;
  --stamp:#5A5A56; --stamp-wash:#F0EDE3;
  --ok:#2E7D4F; --ok-wash:#E6F2EA;
  --warn:#B2740B; --warn-wash:#FAF0DA;
  --crit:#C0392B; --crit-wash:#FBE7E4;
  --shadow:0 1px 2px rgba(16,19,23,.05), 0 8px 24px rgba(16,19,23,.07);
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Roboto Mono",Menlo,monospace;
  --sans:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0C0C0C; --surface:#151515; --surface-2:#1D1D1C; --surface-3:#262624;
    --ink:#F2F2EF; --ink-2:#A0A09B; --ink-3:#74746F;
    --rule:#2C2C2A; --rule-2:#212120;
    --signal:#FFCB05; --signal-ink:#0C0C0C; --signal-txt:#FFCB05;
    --stamp:#A0A09B; --stamp-wash:#241E08;
    --ok:#46B87A; --ok-wash:#14261B;
    --warn:#E0A93C; --warn-wash:#2A2214;
    --crit:#E4695C; --crit-wash:#2C1A18;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#0C0C0C; --surface:#151515; --surface-2:#1D1D1C; --surface-3:#262624;
  --ink:#F2F2EF; --ink-2:#A0A09B; --ink-3:#74746F;
  --rule:#2C2C2A; --rule-2:#212120;
  --signal:#FFCB05; --signal-ink:#0C0C0C; --signal-txt:#FFCB05;
  --stamp:#A0A09B; --stamp-wash:#241E08;
  --ok:#46B87A; --ok-wash:#14261B;
  --warn:#E0A93C; --warn-wash:#2A2214;
  --crit:#E4695C; --crit-wash:#2C1A18;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
:focus-visible{outline:2px solid var(--signal-txt); outline-offset:2px}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}

.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}

.top{
  padding:18px 28px; border-bottom:1px solid var(--rule); background:var(--surface);
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  position:sticky; top:0; z-index:10;
}
.mast{display:flex; align-items:center; gap:16px; min-width:0}
.w{
  display:flex; align-items:baseline; gap:8px; font-size:22px; font-weight:700;
  letter-spacing:.02em; padding-right:16px; border-right:1px solid var(--rule); flex:none;
}
.w b{font-weight:700; color:var(--signal-txt)}
.w i{
  width:8px; height:8px; border:2px solid var(--signal); border-radius:50%;
  display:inline-block; flex:none; transform:translateY(-1px);
}
.top h1{margin:0; font-size:24px; font-weight:700; letter-spacing:-.01em; line-height:1.15}
.top .sub{margin:3px 0 0; font-size:13px; color:var(--ink-2)}
.sp{flex:1}
.stamp{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); border:1px solid var(--rule); padding:5px 9px; border-radius:5px;
  white-space:nowrap;
}
.tools{display:flex; align-items:center; gap:8px}
.tools button{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-2); border:1px solid var(--rule); border-radius:6px; padding:8px 12px;
  min-height:44px;
}
.tools button:hover{border-color:var(--ink); color:var(--ink)}
.tools .langbtn{min-width:44px; text-align:center}
.tools .langbtn.af{border-color:var(--signal); color:var(--signal-txt)}
a.w{color:inherit; text-decoration:none}
.jump{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  border:1px solid var(--ink); border-radius:6px; padding:8px 12px; min-height:44px;
  display:inline-flex; align-items:center; color:var(--ink);
}
.jump:hover{background:var(--signal); color:var(--signal-ink); border-color:#0C0C0C}

.body{padding:24px 28px 60px}

.card{
  background:var(--surface); border:1px solid var(--rule); border-radius:4px;
  box-shadow:var(--shadow); overflow:auto; max-height:calc(100dvh - 132px);
}
table{border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; font-size:13.5px}
th,td{
  padding:10px 12px; text-align:left; border-bottom:1px solid var(--rule-2);
  vertical-align:middle;
}
td{white-space:nowrap}
th{
  font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; background:var(--surface-2);
  border-bottom:1px solid var(--rule); white-space:nowrap; line-height:1.3;
  vertical-align:bottom;
}
thead tr.bands th{
  position:sticky; top:0; z-index:6;
  text-align:left; color:var(--ink); background:var(--surface);
  letter-spacing:.14em; padding:9px 14px; border-bottom:0; white-space:nowrap;
  font-size:11px; vertical-align:middle;
  box-shadow:inset 0 3px 0 var(--signal);
}
thead tr.cols th{position:sticky; top:2.2rem; z-index:5}
thead tr.bands th + th, th.g, td.g{border-left:2px solid var(--rule)}
th.grp-p, td.grp-p{background:rgba(255,203,5,.14)}
th.grp-s, td.grp-s{background:rgba(90,90,86,.08)}
th.sticky, td.sticky{
  position:sticky; left:0; z-index:4; min-width:5.4rem;
  background:var(--surface);
}
th.sticky2, td.sticky2{
  position:sticky; left:5.4rem; z-index:4; min-width:13rem;
  background:var(--surface);
  box-shadow:8px 0 12px rgba(16,19,23,.06);
}
thead tr.cols th.sticky, thead tr.cols th.sticky2{z-index:7; background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--stamp-wash)}
tbody tr:hover td.grp-p{background:rgba(255,203,5,.28)}
tbody tr:hover td.sticky, tbody tr:hover td.sticky2{background:var(--stamp-wash)}
td.n, th.n{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right}
td.name{font-weight:600}
td.neg{color:var(--crit)}
td.mid, th.mid{text-align:center}
.muted{color:var(--ink-3)}

.pill{
  display:inline-flex; align-items:center; gap:5px; padding:2.5px 8px; border-radius:20px;
  font-family:var(--mono); font-size:10.5px; font-weight:600; font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.pill.ok{background:var(--ok-wash); color:var(--ok)}
.pill.warn{background:var(--warn-wash); color:var(--warn)}
.pill.crit{background:var(--crit-wash); color:var(--crit)}
.pill.flat{background:var(--surface-3); color:var(--ink-2)}

tfoot td{
  background:var(--surface-2); font-weight:700;
  border-top:1px solid var(--rule); border-bottom:0;
}
tfoot td.sticky, tfoot td.sticky2{background:var(--surface-2); z-index:4}

th.sortable{cursor:pointer; user-select:none}
th.sortable:hover{color:var(--ink)}
th.sorted{color:var(--signal-txt)}
th.sorted::after{content:" \2191"}
th.sorted.desc::after{content:" \2193"}

.foot-note{margin-top:18px; font-size:12px; color:var(--ink-3); line-height:1.55; max-width:88ch}

#toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:200;
  background:var(--ink); color:var(--ground); padding:10px 16px; border-radius:4px;
  font-size:13.5px; box-shadow:0 8px 30px rgba(0,0,0,.35);
}
#toast[hidden]{display:none}

@media (max-width:720px){
  .top{padding:14px 16px; position:static}
  .body{padding:16px 16px 48px}
  .mast{align-items:flex-start}
  .w{border-right:0; padding-right:0}
}
</style>

<script>
"use strict";

/* Company overview, read as a hand-loaded BuildSmart dump.
   Money is integer cents. Profit percents are fixtures on the row.
   The sign-off target is the only date this page derives, and it is
   ordinary calendar arithmetic, not a contract clause. */

const AS_AT = "2026-08-24";

// SiteOS Rev 4 company overview, "Sign-off target date (90 days after practical or works completion)".
const SIGN_OFF_AFTER_PRACTICAL = 90;

const MONEY = [
  ["priceExcl", "Contract price excl. VAT"],
  ["priceIncl", "Contract price incl. VAT"],
  ["accruals", "Accruals"],
  ["thisPeriod", "This period"],
  ["adjustments", "Adjustments / advance payments"],
  ["cumulative", "Cumulative"],
  ["negative", "Negative projects"],
  ["contractCost", "Contract cost"]
];

/* Four fictional jobs. priceIncl is a dumped figure of its own:
   it is not priceExcl times a VAT rate. Profit percents are stored
   fixtures. They are not (price - cost) / price. */
const ROWS = [
  {
    no: "2401",
    name: "Oakridge School Hall",
    director: "Thabo Mokoena",
    priceExcl: 1800000000,
    priceIncl: 2040000000,
    accruals: 20000000,
    thisPeriod: 75000000,
    adjustments: 0,
    cumulative: 1100000000,
    negative: 0,
    contractCost: 1500000000,
    actualProfitPct: "11.0",
    tenderProfitPct: "12.5",
    practicalCompletion: "2026-04-01",
    closureMeeting: "2026-07-20"
  },
  {
    no: "2408",
    name: "Mill Road Warehouse",
    director: "Elmarie Botha",
    priceExcl: 4200000000,
    priceIncl: 4700000000,
    accruals: 50000000,
    thisPeriod: 180000000,
    adjustments: 40000000,
    cumulative: 2500000000,
    negative: 0,
    contractCost: 4000000000,
    actualProfitPct: "8.5",
    tenderProfitPct: "7.0",
    practicalCompletion: "2026-07-10",
    closureMeeting: null
  },
  {
    no: "2512",
    name: "Riverview Clinic Upgrade",
    director: "Chris Naidoo",
    priceExcl: 950000000,
    priceIncl: 1080000000,
    accruals: 10000000,
    thisPeriod: 30000000,
    adjustments: 0,
    cumulative: 600000000,
    negative: -25000000,
    contractCost: 700000000,
    actualProfitPct: "14.0",
    tenderProfitPct: "14.0",
    practicalCompletion: "2026-05-26",
    closureMeeting: "2026-08-18"
  },
  {
    no: "2603",
    name: "Station Road Office",
    director: "Lindiwe Petersen",
    priceExcl: 600000000,
    priceIncl: 675000000,
    accruals: 0,
    thisPeriod: 15000000,
    adjustments: 10000000,
    cumulative: 80000000,
    negative: 0,
    contractCost: 550000000,
    actualProfitPct: "6.0",
    tenderProfitPct: "9.5",
    practicalCompletion: "2026-06-02",
    closureMeeting: null
  }
];

const THIN = "\u202F";
const MON_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MON_AF = ["Jan","Feb","Mrt","Apr","Mei","Jun","Jul","Aug","Sep","Okt","Nov","Des"];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function formatRand(cents){
  const n = Math.trunc(cents);
  const sign = n < 0 ? "-" : "";
  const rands = Math.trunc(Math.abs(n) / 100);
  const body = String(rands).replace(/\B(?=(\d{3})+(?!\d))/g, THIN);
  return sign + "R" + body;
}

function formatDate(iso){
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  const mon = (LANG === "af" ? MON_AF : MON_EN)[m - 1];
  return d + " " + mon + " " + y;
}

function isLeap(y){
  return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
}
function daysInMonth(y, m){
  return [31, isLeap(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
}
function addCalendarDays(iso, days){
  let [y, m, d] = iso.split("-").map(Number);
  let left = days;
  while (left > 0){
    const room = daysInMonth(y, m) - d;
    if (left <= room){ d += left; left = 0; break; }
    left -= room + 1;
    d = 1;
    m += 1;
    if (m > 12){ m = 1; y += 1; }
  }
  while (left < 0){
    if (d + left >= 1){ d += left; left = 0; break; }
    left += d;
    m -= 1;
    if (m < 1){ m = 12; y -= 1; }
    d = daysInMonth(y, m);
  }
  return y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
}

function signOffTarget(practicalIso){
  return addCalendarDays(practicalIso, SIGN_OFF_AFTER_PRACTICAL);
}

/* Whole calendar days from the sign-off target to AS_AT.
   Sheet column: days delay between sign-off and current date.
   The closure meeting is shown on the row and is not this end date.
   Does not call new Date(). */
function dayNumber(iso){
  const [y, m, d] = iso.split("-").map(Number);
  return Math.round(Date.UTC(y, m - 1, d) / 86400000);
}
function daysOfDelay(targetIso){
  return dayNumber(AS_AT) - dayNumber(targetIso);
}

function sumCents(key){
  return ROWS.reduce((a, row) => a + row[key], 0);
}

let LANG = "en";
try {
  const stored = localStorage.getItem("siteos.lang");
  if (stored === "af" || stored === "en") LANG = stored;
} catch (e) {}

const AF = {
  /* Technical nouns stay English on purpose: accruals, practical completion, sign-off, BuildSmart. */
  "Company overview": "Maatskappy oorsig",
  "One sheet for the contracts director.": "Een blad vir die kontrakte direkteur.",
  "Theme": "Tema",
  "As at": "Soos op",
  "Project profitability": "Projek profit",
  "Project sign-off": "Projek sign-off",
  "BuildSmart dump": "BuildSmart dump",
  "Project no.": "Projek no.",
  "Project": "Projek",
  "Contracts director": "Kontrakte direkteur",
  "Contract price excl. VAT": "Kontrak prys excl. VAT",
  "Contract price incl. VAT": "Kontrak prys incl. VAT",
  "Accruals": "Accruals",
  "Adjustments / advance payments": "Adjustments / advance payments",
  "This period": "Hierdie periode",
  "Cumulative": "Kumulatief",
  "Negative projects": "Negatiewe projekte",
  "Contract cost": "Kontrak koste",
  "Actual profit %": "Werklike profit %",
  "Tender target profit %": "Tender target profit %",
  "Practical completion": "Practical completion",
  "Sign-off target": "Sign-off target",
  "Closure meeting": "Closure meeting",
  "Project app": "Projek-app",
  "Below target": "Onder target",
  "Above target": "Bo target",
  "Days of delay": "Dae vertraging",
  "Total": "Totaal",
  "Yes": "Ja",
  "This view is a BuildSmart dump loaded by hand. The sample rows are not a live link. The sign-off target is 90 calendar days after practical completion. Days of delay are whole days from that target to the as-at date.":
    "Hierdie aansig is 'n BuildSmart dump wat met die hand gelaai is. Die voorbeeldrye is nie 'n live skakel nie. Die sign-off target is 90 kalenderdae na practical completion. Dae vertraging is volle dae van daardie target tot die as-at datum."
};

function tr(s){
  if (LANG !== "af") return s;
  return AF[s] || s;
}

function translateDOM(root){
  if (!root || LANG !== "af") return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes){
    const raw = n.nodeValue;
    const k = raw.trim();
    if (!k || /^[\d\s.,%+\-/]*$/.test(k)) continue;
    const out = tr(k);
    if (out !== k) n.nodeValue = raw.replace(k, out);
  }
}

const NOTE = "This view is a BuildSmart dump loaded by hand. The sample rows are not a live link. The sign-off target is 90 calendar days after practical completion. Days of delay are whole days from that target to the as-at date.";

function flag(on, kind){
  if (!on) return `<span class="muted">\u2014</span>`;
  return `<span class="pill ${kind}">Yes</span>`;
}

function delayPill(n){
  const kind = n > 0 ? "crit" : n === 0 ? "warn" : "flat";
  return `<span class="pill ${kind}">${n}</span>`;
}

function moneyCell(cents){
  const neg = cents < 0 ? " neg" : "";
  return `<td class="n${neg}" data-sort="${cents}">${formatRand(cents)}</td>`;
}

function sheet(){
  const band = `<tr class="bands">
      <th class="dump" colspan="${3 + MONEY.length}">BuildSmart dump</th>
      <th class="profit" colspan="4">Project profitability</th>
      <th class="sign" colspan="4">Project sign-off</th>
    </tr>`;
  const cols = `<tr class="cols">
      <th class="sticky">Project no.</th>
      <th class="sticky2">Project</th>
      <th>Contracts director</th>
      ${MONEY.map(([, label]) => `<th class="n">${esc(label)}</th>`).join("")}
      <th class="n g grp-p">Actual profit %</th>
      <th class="n grp-p">Tender target profit %</th>
      <th class="mid grp-p">Below target</th>
      <th class="mid grp-p">Above target</th>
      <th class="g grp-s">Practical completion</th>
      <th class="grp-s">Sign-off target</th>
      <th class="grp-s">Closure meeting</th>
      <th class="n grp-s">Days of delay</th>
    </tr>`;

  const body = ROWS.map((row) => {
    const target = signOffTarget(row.practicalCompletion);
    const delay = daysOfDelay(target);
    const actual = Number(row.actualProfitPct);
    const tender = Number(row.tenderProfitPct);
    const below = actual < tender;
    const above = actual > tender;
    const money = MONEY.map(([key]) => moneyCell(row[key])).join("");
    const meeting = row.closureMeeting
      ? `<td data-sort="${esc(row.closureMeeting)}">${esc(formatDate(row.closureMeeting))}</td>`
      : `<td data-sort=""><span class="muted">\u2014</span></td>`;
    return `<tr>
      <td class="mono sticky" data-sort="${esc(row.no)}">${esc(row.no)}</td>
      <td class="name sticky2" data-sort="${esc(row.name)}">${esc(row.name)}</td>
      <td data-sort="${esc(row.director)}">${esc(row.director)}</td>
      ${money}
      <td class="n g grp-p" data-sort="${esc(row.actualProfitPct)}">${esc(row.actualProfitPct)}%</td>
      <td class="n grp-p" data-sort="${esc(row.tenderProfitPct)}">${esc(row.tenderProfitPct)}%</td>
      <td class="mid grp-p" data-sort="${below ? 1 : 0}">${flag(below, "warn")}</td>
      <td class="mid grp-p" data-sort="${above ? 1 : 0}">${flag(above, "ok")}</td>
      <td class="g grp-s" data-sort="${esc(row.practicalCompletion)}">${esc(formatDate(row.practicalCompletion))}</td>
      <td class="grp-s" data-sort="${esc(target)}">${esc(formatDate(target))}</td>
      ${meeting.replace("<td ", "<td class=\"grp-s\" ")}
      <td class="n grp-s" data-sort="${delay}">${delayPill(delay)}</td>
    </tr>`;
  }).join("");

  const totals = MONEY.map(([key]) => {
    const cents = sumCents(key);
    const neg = cents < 0 ? " neg" : "";
    return `<td class="n${neg}">${formatRand(cents)}</td>`;
  }).join("");

  return `<table>
    <thead>${band}${cols}</thead>
    <tbody>${body}</tbody>
    <tfoot><tr>
      <td class="sticky">Total</td>
      <td class="sticky2"></td>
      <td></td>
      ${totals}
      <td class="g grp-p"></td><td class="grp-p"></td><td class="grp-p"></td><td class="grp-p"></td>
      <td class="g grp-s"></td><td class="grp-s"></td><td class="grp-s"></td><td class="grp-s"></td>
    </tr></tfoot>
  </table>`;
}

function cellKey(td){
  const raw = td.getAttribute("data-sort");
  if (raw === null || raw === "") return {kind:"s", v:""};
  if (/^-?\d+(\.\d+)?$/.test(raw)) return {kind:"n", v:Number(raw)};
  return {kind:"s", v:raw.toLowerCase()};
}

function makeSortable(table){
  const head = table.tHead;
  if (!head || head.rows.length < 2) return;
  [...head.rows[1].cells].forEach((th, i) => {
    th.classList.add("sortable");
    th.onclick = () => {
      const body = table.tBodies[0];
      const rows = [...body.rows];
      const dir = th.classList.contains("sorted") && !th.classList.contains("desc") ? -1 : 1;
      [...head.rows[1].cells].forEach((c) => {
        c.classList.remove("sorted", "desc");
        c.removeAttribute("aria-sort");
      });
      th.classList.add("sorted");
      if (dir < 0) th.classList.add("desc");
      th.setAttribute("aria-sort", dir < 0 ? "descending" : "ascending");
      rows.sort((a, b) => {
        const x = cellKey(a.cells[i]);
        const y = cellKey(b.cells[i]);
        let cmp;
        if (x.kind === "n" && y.kind === "n") cmp = x.v - y.v;
        else cmp = x.v < y.v ? -1 : x.v > y.v ? 1 : 0;
        return cmp * dir;
      });
      rows.forEach((r) => body.appendChild(r));
    };
  });
}

function render(){
  document.documentElement.lang = LANG === "af" ? "af" : "en";
  $("#title").textContent = tr("Company overview");
  $("#sub").textContent = tr("One sheet for the contracts director.");
  $("#theme").textContent = tr("Theme");
  $("#note").textContent = tr(NOTE);
  $("#asof").textContent = tr("As at") + " " + formatDate(AS_AT);
  $("#lang").textContent = LANG === "af" ? "AF" : "EN";
  $("#lang").classList.toggle("af", LANG === "af");
  $("#to-app").textContent = tr("Project app");
  $("#sheet").innerHTML = sheet();
  translateDOM($("#sheet"));
  makeSortable($("#sheet").querySelector("table"));
}

let toastT;
function toast(msg){
  const el = $("#toast");
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.hidden = true; }, 2600);
}

$("#theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
};

$("#lang").onclick = () => {
  LANG = LANG === "af" ? "en" : "af";
  try {
    localStorage.setItem("siteos.lang", LANG);
    localStorage.setItem("plumbline.lang", LANG);
  } catch (e) {}
  render();
  toast(LANG === "af" ? "Taal gestel op Afrikaans" : "Language set to English");
};

addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
  if (typing) return;
  if (e.key.toLowerCase() === "l") $("#lang").click();
});

render();
</script>
</body>
</html>
