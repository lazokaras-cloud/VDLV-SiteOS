<body>
<style>
:root{
  --ground:#EDEFF1; --surface:#FFFFFF; --surface-2:#F3F5F7; --surface-3:#E9EDF0;
  --ink:#16191D; --ink-2:#59626A; --ink-3:#8B949C;
  --rule:#D4D9DD; --rule-2:#E8ECEF;
  --signal:#00A28C; --signal-ink:#FFFFFF;
  --stamp:#4E5A64; --stamp-wash:#EAEEF1;
  --ok:#12855C; --ok-wash:#E4F3EC;
  --warn:#A5760E; --warn-wash:#F8F0DE;
  --crit:#C03A2D; --crit-wash:#FBE8E5;
  --shadow:0 1px 2px rgba(16,19,23,.05), 0 8px 24px rgba(16,19,23,.07);
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Roboto Mono",Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1013; --surface:#16191D; --surface-2:#1E2227; --surface-3:#252A31;
    --ink:#EDEFF1; --ink-2:#9BA3AB; --ink-3:#6D767E;
    --rule:#2A2F35; --rule-2:#202429;
    --signal:#00D7B9; --signal-ink:#04201C;
    --stamp:#9AA6B0; --stamp-wash:#1A2126;
    --ok:#3FCF8E; --ok-wash:#10241C;
    --warn:#E8B33A; --warn-wash:#2A2214;
    --crit:#FF6B5E; --crit-wash:#2C1A18;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1013; --surface:#16191D; --surface-2:#1E2227; --surface-3:#252A31;
  --ink:#EDEFF1; --ink-2:#9BA3AB; --ink-3:#6D767E;
  --rule:#2A2F35; --rule-2:#202429;
  --signal:#00D7B9; --signal-ink:#04201C;
  --stamp:#9AA6B0; --stamp-wash:#1A2126;
  --ok:#3FCF8E; --ok-wash:#10241C;
  --warn:#E8B33A; --warn-wash:#2A2214;
  --crit:#FF6B5E; --crit-wash:#2C1A18;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
:focus-visible{outline:2px solid var(--signal); outline-offset:2px}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}

.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.lab{font-family:var(--mono); font-size:9.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-3)}

/* -- shell ------------------------------------------------------- */
.shell{display:grid; grid-template-columns:224px 1fr; min-height:100vh; min-height:100dvh}

.side{
  border-right:1px solid var(--rule); background:var(--surface);
  display:flex; flex-direction:column; position:sticky; top:0; height:100dvh;
}
.brand{padding:20px 20px 16px; border-bottom:1px solid var(--rule)}
.brand .w{display:flex; align-items:baseline; gap:8px; font-size:19px; font-weight:250; letter-spacing:.02em}
.brand .w b{font-weight:250; color:var(--signal)}
.brand .w i{width:7px; height:7px; border:2px solid var(--signal); border-radius:50%; flex:none; transform:translateY(-1px)}
.brand .co{margin-top:12px; display:flex; align-items:center; gap:8px}
.brand .co svg{width:24px; height:24px; flex:none; border-radius:2px}
.brand .co span{font-size:11.5px; font-weight:650; line-height:1.2}

.nav{padding:10px 10px; display:flex; flex-direction:column; gap:1px; flex:1; overflow-y:auto}
.nav button{
  display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:7px;
  color:var(--ink-2); text-align:left; width:100%;
}
.nav button svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.7; flex:none}
.nav button:hover{background:var(--surface-2); color:var(--ink)}
.nav button.on{background:var(--surface-2); color:var(--ink); font-weight:600}
.nav button.on svg{stroke:var(--signal)}
.nav button .ct{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--ink-3)}
.nav .sec{padding:14px 11px 6px}

.side .foot{padding:12px 14px; border-top:1px solid var(--rule); display:flex; gap:10px; align-items:center}
.side .foot button{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.side .foot button:hover{color:var(--ink)}

.main{min-width:0; display:flex; flex-direction:column}
.top{
  padding:18px 28px; border-bottom:1px solid var(--rule); background:var(--surface);
  display:flex; align-items:flex-end; gap:18px; flex-wrap:wrap; position:sticky; top:0; z-index:10;
}
.top h1{margin:0; font-size:24px; font-weight:350; letter-spacing:-.01em; line-height:1.15}
.top .sub{margin:3px 0 0; font-size:13px; color:var(--ink-2)}
.top .sp{flex:1}
.top .stamp{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); border:1px solid var(--rule); padding:5px 9px; border-radius:5px;
}
.body{padding:24px 28px 60px; flex:1}

/* -- primitives -------------------------------------------------- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:1px;
      background:var(--rule); border:1px solid var(--rule); border-radius:10px; overflow:hidden}
.kpis > div{background:var(--surface); padding:15px 17px}
.kpis b{display:block; font-family:var(--mono); font-size:25px; font-weight:700;
        letter-spacing:-.03em; line-height:1.1; margin-top:5px}
.kpis .d{display:block; font-size:12px; color:var(--ink-2); margin-top:4px}
.kpis .up b{color:var(--ok)} .kpis .dn b{color:var(--crit)}

.sec{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:30px 0 10px}
.card{background:var(--surface); border:1px solid var(--rule); border-radius:10px; box-shadow:var(--shadow); overflow:hidden}

.tw{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:13.5px; min-width:680px}
th,td{padding:10px 15px; text-align:left; border-bottom:1px solid var(--rule-2); vertical-align:middle}
th{font-family:var(--mono); font-size:9.5px; letter-spacing:.15em; text-transform:uppercase;
   color:var(--ink-3); font-weight:600; background:var(--surface-2);
   border-bottom:1px solid var(--rule); white-space:nowrap; position:sticky; top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
td.n, th.n{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
td.name{font-weight:600}
td .sub{display:block; font-size:11.5px; color:var(--ink-3); font-weight:400; margin-top:1px}

.pill{display:inline-flex; align-items:center; gap:5px; padding:2.5px 8px; border-radius:20px;
      font-family:var(--mono); font-size:10.5px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap}
.pill.ok{background:var(--ok-wash); color:var(--ok)}
.pill.warn{background:var(--warn-wash); color:var(--warn)}
.pill.crit{background:var(--crit-wash); color:var(--crit)}
.pill.flat{background:var(--surface-2); color:var(--ink-2)}
.pill.sig{background:var(--signal); color:var(--signal-ink)}
.ed{font-family:var(--mono); font-size:9.5px; padding:2px 6px; border-radius:3px;
    background:var(--surface-2); color:var(--ink-2); border:1px solid var(--rule); white-space:nowrap}

/* programme bar: baseline against forecast */
.prog{position:relative; height:16px; min-width:130px; background:var(--surface-2); border-radius:3px; overflow:hidden}
.prog .base{position:absolute; left:0; top:0; bottom:8px; background:var(--ink-3); opacity:.4; border-radius:3px 0 0 0}
.prog .act{position:absolute; left:0; top:8px; bottom:0; border-radius:0 0 0 3px}
.prog .act.ok{background:var(--ok)} .prog .act.late{background:var(--crit)}
.prog .now{position:absolute; top:0; bottom:0; width:1.5px; background:var(--signal)}

/* control point meter */
.cp{display:flex; align-items:center; gap:9px}
.cp .track{flex:1; min-width:70px; height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden}
.cp .fill{height:100%; background:var(--signal)}
.cp span{font-family:var(--mono); font-size:11px; color:var(--ink-2); white-space:nowrap}

/* site cards */
.sites{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:14px}
.site{background:var(--surface); border:1px solid var(--rule); border-radius:10px;
      box-shadow:var(--shadow); padding:15px 16px; text-align:left; width:100%;
      transition:transform .14s ease, border-color .14s ease}
.site:hover{transform:translateY(-2px); border-color:var(--ink-3)}
.site .r1{display:flex; align-items:flex-start; gap:8px; margin-bottom:3px}
.site .r1 b{font-size:15px; font-weight:600; flex:1; min-width:0; line-height:1.25}
.site .town{font-size:11.5px; color:var(--ink-3)}
.site .rows{margin-top:12px; display:flex; flex-direction:column; gap:7px}
.site .row{display:flex; justify-content:space-between; gap:10px; font-size:12.5px}
.site .row span:first-child{color:var(--ink-2)}
.site .row span:last-child{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600}
.site .clk{margin-top:12px; padding-top:11px; border-top:1px solid var(--rule-2);
           display:flex; align-items:center; gap:8px; font-size:12px}
.site .clk .what{color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* filters */
.filters{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px}
.filters button{
  padding:5px 11px; border:1px solid var(--rule); border-radius:20px; background:var(--surface);
  font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2);
}
.filters button:hover{border-color:var(--ink-3); color:var(--ink)}
.filters button.on{background:var(--ink); color:var(--ground); border-color:var(--ink)}

/* detail */
.back{display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:10.5px;
      letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2); margin-bottom:4px}
.back:hover{color:var(--ink)}
.back svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2.2}
.two{display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:16px}
.panel{background:var(--surface); border:1px solid var(--rule); border-radius:10px; box-shadow:var(--shadow)}
.panel h3{margin:0; padding:12px 16px; font-size:12px; font-weight:600; border-bottom:1px solid var(--rule);
          font-family:var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.panel .in{padding:14px 16px}
.kv{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--rule-2); font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink-2)}
.kv span:last-child{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600}
.kv .up{color:var(--ok)} .kv .dn{color:var(--crit)}

.empty{padding:40px 20px; text-align:center; color:var(--ink-2)}
.foot-note{margin-top:18px; font-size:12px; color:var(--ink-3); line-height:1.55; max-width:80ch}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static; height:auto; border-right:0; border-bottom:1px solid var(--rule)}
  .brand{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px}
  .brand .co{margin-top:0}
  .nav{flex-direction:row; overflow-x:auto; padding:8px 10px}
  .nav button{white-space:nowrap}
  .nav button .ct, .nav .sec{display:none}
  .side .foot{display:none}
  .top{padding:14px 16px; position:static}
  .body{padding:18px 16px 50px}
}
</style>

        Team</button>
    </nav>

    <div class="foot">
      <button id="theme">Theme</button>
      <button id="reset">Reset</button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <div id="head"></div>
      <span class="sp"></span>
      <span class="stamp" id="asof"></span>

<script>
"use strict";

/* ================================================================
   Working days. Head office argues about dates more than site does,
   so the same calendar has to sit behind both.
   ================================================================ */
const TODAY = new Date(2026, 7, 25);
const HOLIDAYS = new Set([
  "2026-01-01","2026-03-23","2026-04-03","2026-04-06","2026-04-27","2026-05-01",
  "2026-06-16","2026-08-10","2026-09-24","2026-12-16","2026-12-25","2026-12-28",
  "2027-01-01","2027-03-22","2027-03-26","2027-03-29","2027-04-27","2027-05-01",
  "2027-06-16","2027-08-09","2027-09-24","2027-12-16","2027-12-27","2027-12-28"
]);
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const isWork = d => d.getDay()!==0 && d.getDay()!==6 && !HOLIDAYS.has(iso(d));
function workdaysBetween(a,b){
  const d = new Date(a); let n = 0, dir = b >= a ? 1 : -1;
  while (dir > 0 ? d < b : d > b){ d.setDate(d.getDate()+dir); if (isWork(d)) n += dir; }
  return n;
}
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt = d => d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear();
const R = n => "R"+Math.round(n).toLocaleString("en-ZA").replace(/,/g," ");
const Rm = n => "R"+(n/1e6).toFixed(1)+"m";
const D = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };

/* ================================================================
   The book of work, and the six value areas the transformation
   programme is organised around. Contract editions differ per
   project on purpose: it is the thing head office cannot hold in
   its head, and the reason the clock column exists at all.
   ================================================================ */
const SEED = {
  projects:[
    { id:"lou", name:"Lourensford Office Park Ph2", town:"Somerset West", client:"Lourensford Estate Holdings",
      ed:"JBCC PBA 05/2018", stage:"On site", value:48240000, baseValue:48240000,
      baseMargin:7.4, nowMargin:6.9, start:"2026-02-09", pcBase:"2027-03-19", pcNow:"2027-04-08",
      cp:{done:31,total:48}, agent:"Ruan Bekker", cm:"Danie Marais",
      certified:18420000, retention:921000, contra:71500,
      ctc:27960000, capture:9, labourAllow:100, labourAct:106, rework:4, rfiOpen:3 },
    { id:"tyg", name:"Tygerberg Retail Centre", town:"Bellville", client:"Cape Retail Partners",
      ed:"JBCC PBA 03/2014", stage:"Claims", value:71600000, baseValue:70200000,
      baseMargin:8.1, nowMargin:8.4, start:"2025-09-01", pcBase:"2027-01-15", pcNow:"2027-01-15",
      cp:{done:39,total:48}, agent:"Pieter Louw", cm:"Danie Marais",
      certified:44100000, retention:2205000, contra:0,
      ctc:25100000, capture:2, labourAllow:100, labourAct:97, rework:1, rfiOpen:1 },
    { id:"str", name:"Strand Beachfront Apartments", town:"Strand", client:"Bayline Developments",
      ed:"JBCC PBA 05/2018", stage:"Completion", value:39900000, baseValue:39900000,
      baseMargin:6.6, nowMargin:5.2, start:"2025-05-12", pcBase:"2026-08-14", pcNow:"2026-08-14",
      cp:{done:44,total:48}, agent:"Nadia Fourie", cm:"Willem Steyn",

const $ = s => document.querySelector(s);

const proj = id => S.projects.find(p => p.id === id) || {name:"?", ed:"?", town:"?"};
const wdTo = d => workdaysBetween(TODAY, D(d));
const sevOf = wd => wd <= 3 ? "crit" : wd <= 15 ? "warn" : "ok";
const pct = n => Math.round(n*100) + "%";

const totals = () => {
  const v = S.projects.reduce((a,p)=>a+p.value,0);
  const wBase = S.projects.reduce((a,p)=>a+p.baseMargin*p.value,0)/v;
  const wNow  = S.projects.reduce((a,p)=>a+p.nowMargin*p.value,0)/v;
  const risk  = S.clocks.filter(c => wdTo(c.due) <= 20).reduce((a,c)=>a+c.at,0);
  const certified = S.projects.reduce((a,p)=>a+p.certified,0);
  const retention = S.projects.reduce((a,p)=>a+p.retention,0);
  const overdue = S.outputs.filter(o => o.status === "Overdue").reduce((a,o)=>a+o.amount,0);
  return { v, wBase, wNow, drift:wNow-wBase, risk, certified, retention, overdue };
};

function progBar(p){
  const s = D(p.start), b = D(p.pcBase), n = D(p.pcNow);
  const span = Math.max(n - s, b - s);
  const w = x => Math.max(2, Math.min(100, ((x - s) / span) * 100));
  const late = n > b;
  return `<div class="prog" title="${esc(fmt(b))} baseline, ${esc(fmt(n))} forecast">
    <div class="base" style="width:${w(b)}%"></div>
    <div class="act ${late?"late":"ok"}" style="width:${w(n)}%"></div>
    <div class="now" style="left:${w(TODAY)}%"></div>
  </div>`;
}
function cpMeter(p){
  const v = Math.round(p.cp.done / p.cp.total * 100);
  return `<div class="cp"><div class="track"><div class="fill" style="width:${v}%"></div></div>
    <span>${p.cp.done}/${p.cp.total}</span></div>`;
}
function meter(v, sev){
  return `<div class="cp"><div class="track"><div class="fill" style="width:${Math.min(100,v)}%;background:var(--${sev})"></div></div></div>`;
}
function head(title, sub, eyebrow){
  $("#head").innerHTML =
    (eyebrow?`<div class="lab" style="margin-bottom:6px">${esc(eyebrow)}</div>`:"") +
    `<h1>${esc(title)}</h1>${sub?`<p class="sub">${sub}</p>`:""}`;
}
function tbl(headers, rows, min){
  return `<div class="card"><div class="tw"><table${min?` style="min-width:${min}px"`:""}>
    <thead><tr>${headers.map(h=>`<th${h[1]?' class="'+h[1]+'"':""}>${h[0]}</th>`).join("")}</tr></thead>
    <tbody>${rows}</tbody></table></div></div>`;
}

/* ---------------- 02 Procurement ---------------- */

  const worst = S.suppliers.slice().sort((a,b)=>a.onTime-b.onTime)[0];
  const late = S.expedite.filter(e=>!e.ordered);
  head("Procurement", "Quote comparison, supplier performance, lead-time risk, expediting", "02 Value area");
  return `
    <div class="kpis">
      <div class="up"><span class="lab">Against highest quote</span><b>${R(saved)}</b><span class="d">On ${S.adjudications.length} open adjudications</span></div>
      <div class="dn"><span class="lab">Weakest supplier</span><b>${pct(worst.onTime)}</b><span class="d">${esc(worst.name)} on time</span></div>
      <div class="dn"><span class="lab">Not yet ordered</span><b>${late.length}</b><span class="d">Long-lead items still open</span></div>
      <div class="up"><span class="lab">Settlement discount</span><b>${pct(S.suppliers.reduce((a,s)=>a+s.discount,0)/S.suppliers.length)}</b><span class="d">Average available on terms</span></div>
    </div>

    <div class="sec"><span class="lab">Open adjudications</span><span class="lab">Three quotes, and why</span></div>
    ${tbl([["Item"],["Project"],["Lowest","n"],["Chosen","n"],["Highest","n"],["Reason"]],
      S.adjudications.map(a=>`<tr class="click" data-p="${a.proj}">
        <td class="name">${esc(a.item)}</td><td>${esc(proj(a.proj).town)}</td>
        <td class="n">${R(a.low)}</td>
        <td class="n" style="font-weight:700">${R(a.chosen)}${a.chosen>a.low?`<span class="sub" style="color:var(--warn)">+${R(a.chosen-a.low)}</span>`:""}</td>
        <td class="n" style="color:var(--ink-3)">${R(a.high)}</td>
        <td style="color:var(--ink-2)">${esc(a.why)}</td></tr>`).join(""), 680)}

    <div class="sec"><span class="lab">Supplier performance</span></div>
    ${tbl([["Supplier"],["Category"],["On time","n"],["Defects","n"],["Discount","n"],["Lead wks","n"],["Record"]],
      S.suppliers.slice().sort((a,b)=>b.onTime-a.onTime).map(s=>{
        const sev = s.onTime>=0.9?"ok":s.onTime>=0.8?"warn":"crit";
        return `<tr><td class="name">${esc(s.name)}</td><td style="color:var(--ink-2)">${esc(s.cat)}</td>
          <td class="n"><span class="pill ${sev}">${pct(s.onTime)}</span></td>
          <td class="n" style="color:var(--${s.defects>4?"crit":s.defects?"warn":"ok"})">${s.defects}</td>
          <td class="n">${s.discount?pct(s.discount):"&ndash;"}</td><td class="n">${s.lead}</td>
          <td style="width:140px">${meter(s.onTime*100, sev)}</td></tr>`;}).join(""), 680)}
    <p class="foot-note">Bekker Plumbing sits at 62% on time with seven defects, and is the sub-contractor currently on a default notice at Lourensford. That is the same fact reaching head office and the site from opposite directions.</p>

    <div class="sec"><span class="lab">Expediting</span><span class="lab">Order-by date derived from lead time</span></div>
    ${tbl([["Item"],["Project"],["Needed on","n"],["Lead wks","n"],["Order by","n"],["Status"]],
      S.expedite.map(e=>{
        const by = new Date(D(e.need)); by.setDate(by.getDate() - e.lead*7);
        const wd = workdaysBetween(TODAY, by);
        return `<tr class="click" data-p="${e.proj}">
          <td class="name">${esc(e.item)}</td><td>${esc(proj(e.proj).town)}</td>
          <td class="n">${esc(fmt(D(e.need)))}</td><td class="n">${e.lead}</td>
          <td class="n">${esc(fmt(by))} <span class="sub">${wd<0?Math.abs(wd)+" wd late":wd+" wd"}</span></td>
          <td>${e.ordered?`<span class="pill ok">Ordered</span>`:`<span class="pill ${wd<0?"crit":"warn"}">${wd<0?"Overdue":"Open"}</span>`}</td>
        </tr>`;}).join(""), 700)}`;
}

/* ---------------- 03 Site productivity ---------------- */
function vSite(){
  const avgCap = S.projects.reduce((a,p)=>a+(p.capture===0?1:0),0);
  const totRework = S.projects.reduce((a,p)=>a+p.rework,0);
  const rfi = S.projects.reduce((a,p)=>a+p.rfiOpen,0);
  head("Site productivity", "Daily capture, labour and plant signals, progress and rework, access to information", "03 Value area");
  return `
    <div class="kpis">
      <div class="${avgCap===S.projects.length?"up":"dn"}"><span class="lab">Captured today</span><b>${avgCap}/${S.projects.length}</b><span class="d">Sites that logged today</span></div>
      <div class="dn"><span class="lab">Rework open</span><b>${totRework}</b><span class="d">Items across all sites</span></div>
      <div class="dn"><span class="lab">RFIs open</span><b>${rfi}</b><span class="d">Waiting on information</span></div>
      <div class="dn"><span class="lab">Labour over allowable</span><b>${S.projects.filter(p=>p.labourAct>100).length}</b><span class="d">Of ${S.projects.length} sites</span></div>
    </div>

    <div class="sec"><span class="lab">By site</span><span class="lab">Signals captured on the phone, not chased by the office</span></div>
    ${tbl([["Project"],["Last capture","n"],["Labour vs allowable","n"],[""],["Rework","n"],["RFIs open","n"],["Control points"]],
      S.projects.map(p=>{
        const capSev = p.capture===0?"ok":p.capture<=3?"warn":"crit";
        const labSev = p.labourAct>105?"crit":p.labourAct>100?"warn":"ok";
        return `<tr class="click" data-p="${p.id}">
          <td class="name">${esc(p.name)}<span class="sub">${esc(p.agent)}</span></td>
          <td class="n"><span class="pill ${capSev}">${p.capture===0?"today":p.capture+" d ago"}</span></td>
          <td class="n" style="color:var(--${labSev})">${p.labourAct}%</td>
          <td style="width:130px">${meter(p.labourAct*0.8, labSev)}</td>
          <td class="n" style="color:var(--${p.rework>5?"crit":p.rework?"warn":"ok"})">${p.rework}</td>
          <td class="n">${p.rfiOpen}</td>
          <td>${cpMeter(p)}</td></tr>`;}).join(""), 760)}
    <p class="foot-note">Stellenbosch has not been captured in twenty-one days and is running 18% over allowable labour. Those two numbers are the same problem: the site that stops reporting is the site that has stopped being managed, and the cost only shows up at final account.</p>`;
}

/* ---------------- 04 Commercial ---------------- */
function vCommercial(){
  const t = totals();
  const ctc = S.projects.reduce((a,p)=>a+p.ctc,0);
  const atRisk = S.projects.filter(p=>p.nowMargin<p.baseMargin).reduce((a,p)=>a+(p.baseMargin-p.nowMargin)/100*p.value,0);
  head("Commercial", "Cost-to-complete, variations, claims, cash and margin at risk", "04 Value area");
  return `
    <div class="kpis">
      <div><span class="lab">Cost to complete</span><b>${Rm(ctc)}</b><span class="d">Across ${S.projects.length} projects</span></div>
      <div class="dn"><span class="lab">Margin at risk</span><b>${R(atRisk)}</b><span class="d">Value of the drift against tender</span></div>
      <div><span class="lab">Certified</span><b>${Rm(t.certified)}</b><span class="d">${Rm(t.v-t.certified)} still to certify</span></div>
      <div class="dn"><span class="lab">Overdue value</span><b>${R(t.overdue)}</b><span class="d">Past a contractual window</span></div>
      <div class="dn"><span class="lab">Contra open</span><b>${R(S.projects.reduce((a,p)=>a+p.contra,0))}</b><span class="d">Deduct before the next certificate</span></div>
    </div>

    <div class="sec"><span class="lab">Cash and margin by project</span></div>
    ${tbl([["Project"],["Contract","n"],["Certified","n"],["Outstanding","n"],["Cost to complete","n"],["Retention","n"],["Contra","n"],["Margin","n"]],
      S.projects.map(p=>{const dm=p.nowMargin-p.baseMargin;
        return `<tr class="click" data-p="${p.id}">
          <td class="name">${esc(p.name)}</td>
          <td class="n">${R(p.value)}</td><td class="n">${R(p.certified)}</td>
          <td class="n">${R(p.value-p.certified)}</td><td class="n">${R(p.ctc)}</td>
          <td class="n">${R(p.retention)}</td>
          <td class="n" style="color:var(--${p.contra?"crit":"ink-3"})">${p.contra?R(p.contra):"&ndash;"}</td>
          <td class="n" style="color:var(--${dm>=0?"ok":"crit"})">${p.nowMargin.toFixed(1)}%<span class="sub">${dm>=0?"+":""}${dm.toFixed(1)}</span></td>
        </tr>`;}).join(""), 860)}

    <div class="sec"><span class="lab">Variations and claims</span></div>
    ${outsTable(S.outputs.filter(o=>["Variation","Claim","Final account"].includes(o.type)), true)}
    <p class="foot-note">Margin is measured against the price each job was won at, never against a revised internal budget. A budget that moves with the job cannot tell you the job is losing money.</p>`;
}

      <div class="dn"><span class="lab">Early warnings</span><b>${S.warnings.length}</b><span class="d">Open across the portfolio</span></div>

    <div class="sec"><span class="lab">Early warning</span><span class="lab">Raised from site, not found in a month-end review</span></div>
    ${tbl([["Signal"],["Project"],["Days","n"],["Cost","n"],["Owner"]],
      S.warnings.map(w=>`<tr class="click" data-p="${w.proj}">
        <td class="name">${esc(w.signal)}</td><td>${esc(proj(w.proj).town)}</td>
        <td class="n">${w.days?`<span class="pill warn">${w.days} wd</span>`:"&ndash;"}</td>
        <td class="n" style="color:var(--crit)">${R(w.cost)}</td>
        <td>${esc(w.owner)}</td></tr>`).join(""), 620)}

    <div class="sec"><span class="lab">Critical path</span></div>
    ${tbl([["Activity"],["Project"],["Float","n"],["Exposure","n"],["Programme"]],
      S.critical.map(c=>{const p=proj(c.proj);
        return `<tr class="click" data-p="${c.proj}">
          <td class="name">${esc(c.act)}</td><td>${esc(p.town)}</td>
          <td class="n"><span class="pill ${c.float<0?"crit":c.float===0?"warn":"ok"}">${c.float>0?"+":""}${c.float} d</span></td>

    <div class="sec"><span class="lab">Recovery scenarios</span><span class="lab">What each option is actually worth</span></div>

        <td class="n" style="color:var(--${r.net>=0?"ok":"crit"});font-weight:700">${r.net>=0?"+":""}${R(r.net)}</td>
      </tr>`).join(""), 620)}
    <p class="foot-note">The second option at Lourensford recovers nothing on site and is worth more than the first, because four days claimed as an extension carries the time-related preliminaries with it. Recovery is a commercial decision before it is a programme one.</p>`;

/* ---------------- Outputs and clocks ---------------- */
const STATUS_SEV = { "Overdue":"crit", "Deemed refused":"crit", "Objection due":"crit",
  "Running":"warn", "Awaiting PA":"warn", "Submitted":"warn", "With PQS":"warn",
  "Certified":"ok", "Issued":"ok", "Paid":"ok" };

function outsTable(list, showProj){
  if (!list.length) return `<div class="card"><div class="empty">Nothing here yet.</div></div>`;
  return `<div class="card"><div class="tw"><table>
    <thead><tr><th>Reference</th><th>Type</th>${showProj?"<th>Project</th>":""}
      <th>Raised</th><th>By</th><th class="n">Value</th><th>Status</th><th class="n">Acts by</th></tr></thead>
    <tbody>${list.map(o=>{const wd = o.due ? wdTo(o.due) : null;
      return `<tr${showProj?' class="click" data-p="'+o.proj+'"':""}>
        <td class="name">${esc(o.ref)}</td><td><span class="ed">${esc(o.type)}</span></td>
        ${showProj?`<td>${esc(proj(o.proj).name)}<span class="sub">${esc(proj(o.proj).ed)}</span></td>`:""}
        <td class="mono">${esc(o.date)}</td><td>${esc(o.by)}</td>
        <td class="n">${o.amount?R(o.amount):"&ndash;"}</td>
        <td><span class="pill ${STATUS_SEV[o.status]||"flat"}">${esc(o.status)}</span></td>
        <td class="n">${wd!==null?`<span class="pill ${sevOf(wd)}">${wd} wd</span>`:"&ndash;"}</td>
      </tr>`;}).join("")}</tbody></table></div></div>`;
}

function vOutputs(){
  const types = ["All","Variation","Claim","Notice","Progress","Default","Final account"];
  const list = FILTER === "All" ? S.outputs : S.outputs.filter(o=>o.type===FILTER);
  head("Outputs", "Every document the sites produced, and who has to act on it next", "Records");
  return `<div class="filters">${types.map(t=>
      `<button data-f="${esc(t)}" class="${t===FILTER?"on":""}">${esc(t)}</button>`).join("")}</div>
    ${outsTable(list, true)}
    <p class="foot-note">Head office does not chase these. Each was produced on a phone on site, by the person doing the work, at the moment the clock started. This register is the by-product, not the effort.</p>`;
}

function vClocks(){
  const list = S.clocks.slice().sort((a,b)=>wdTo(a.due)-wdTo(b.due));
  head("Clocks", "Every contractual deadline running across the company", "Records");
  return tbl([["Working days","n"],["What"],["Project"],["Basis"],["Due","n"],["At stake","n"]],
    list.map(c=>{const wd=wdTo(c.due), p=proj(c.proj);
      return `<tr class="click" data-p="${c.proj}">
        <td class="n"><span class="pill ${sevOf(wd)}">${wd} wd</span></td>
        <td class="name">${esc(c.what)}</td>
        <td>${esc(p.name)}<span class="sub">${esc(p.ed)}</span></td>
        <td style="color:var(--ink-2)">${esc(c.basis)}</td>
        <td class="n">${esc(fmt(D(c.due)))}</td>
        <td class="n">${c.at?R(c.at):"&ndash;"}</td></tr>`;}).join(""))
    + `<p class="foot-note">Three editions of the same contract are live here at once. The final account window is 90 working days under the 2007 and 2014 editions and 60 under 2018; a works completion list is 7 days on one and 5 working days plus 5 on another. Nobody is expected to remember which, and nobody should have to.</p>`;
}

function vTeam(){
  head("Team", "Who owns what, and whose notices go out inside the window", "Records");
  return tbl([["Name"],["Role"],["Projects"],["On time","n"],["Late this year","n"],["Record"]],
    S.team.slice().sort((a,b)=>b.onTime-a.onTime).map(m=>{
      const v = Math.round(m.onTime*100), sev = v>=90?"ok":v>=80?"warn":"crit";
      return `<tr><td class="name">${esc(m.name)}</td><td style="color:var(--ink-2)">${esc(m.role)}</td>
        <td>${m.projects.map(id=>`<span class="ed" style="margin-right:4px">${esc(proj(id).town)}</span>`).join("")}</td>
        <td class="n"><span class="pill ${sev}">${v}%</span></td><td class="n">${m.late}</td>
        <td style="width:150px">${meter(v, sev)}</td></tr>`;}).join(""))
    + `<p class="foot-note">On time means the notice reached the principal agent inside the contractual window. It is the one measure that cannot be gamed in a way that hurts the business: a site agent who games it is a site agent who never misses a claim. Pieter Louw carries two projects and the worst record on this table, which is a workload question before it is a performance one.</p>`;
}

/* ================================================================
   Router
   ================================================================ */
const AREAS = [
  ["01","Tender","tender","Bid speed, scope risk, estimating"],
  ["02","Procurement","procurement","Quotes, suppliers, lead time"],
  ["03","Site productivity","siteprod","Capture, labour, rework, RFIs"],
  ["04","Commercial","commercial","Cost to complete, variations, cash"],
  ["05","Programme","programme","Early warning, critical path"],
  ["06","Knowledge","knowledge","Close-out, lessons, benchmarks"]
];

const VIEWS = { portfolio:vPortfolio, sites:vSites, project:vProject,
                tender:vTender, procurement:vProcurement, siteprod:vSite,
                commercial:vCommercial, programme:vProgramme, knowledge:vKnowledge,
                outputs:vOutputs, clocks:vClocks, team:vTeam };

function render(){
  $("#view").innerHTML = VIEWS[VIEW]();
  $("#asof").textContent = "As at " + fmt(TODAY);
  document.querySelectorAll("#nav button").forEach(b =>
    b.classList.toggle("on", b.dataset.v === VIEW || (VIEW === "project" && b.dataset.v === "sites")));
  $("#ct-sites").textContent = S.projects.length;
  $("#ct-outputs").textContent = S.outputs.length;
  $("#ct-clocks").textContent = S.clocks.filter(c => wdTo(c.due) <= 20).length;
  window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const nav = e.target.closest("[data-v]");
  if (nav){ VIEW = nav.dataset.v; SEL = null; FILTER = "All"; render(); return; }
  const f = e.target.closest("[data-f]");
  if (f){ FILTER = f.dataset.f; render(); return; }
  if (e.target.closest("#back")){ VIEW = "portfolio"; SEL = null; render(); return; }
  const row = e.target.closest("[data-p]");
  if (row){ SEL = row.dataset.p; VIEW = "project"; render(); return; }
});

$("#theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
};
$("#reset").onclick = () => {
  S = JSON.parse(JSON.stringify(SEED)); save(); VIEW = "portfolio"; SEL = null; FILTER = "All"; render();
};

render();

</script>
</body>
</html>
